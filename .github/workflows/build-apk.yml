name: Build APK
on:
  push:
    branches: [main, master]
    paths-ignore: ['pwa/**', '.github/workflows/pages.yml', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Apply the app icon and splash screen
        run: |
          cp -r branding/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -delete
      - name: Copy the app into it
        run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-turns-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Shuttle Turns APK ${{ github.run_number }}" \
            --notes "Android debug APK. Open this file on your phone to install."
