name: Build APK
on:
  push:
    branches: [main, master]
    paths-ignore: ['pwa/**', '.github/workflows/pages.yml', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Apply the app icon and splash screen
        run: |
          cp -r branding/res/. android/app/src/main/res/
          find android/app/src/main/res -name 'splash.png' -delete
      - name: Copy the app into it
        run: npx cap sync android
      - name: Use the fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | tr -d ' \r\n' | base64 -d > ~/.android/debug.keystore || true
            KFP=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>&1 | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
            [ -z "$KFP" ] && KFP="could not be read as a keystore"
            echo "KEYNOTE=Secret found (length ${#KS}). Decoded key: ${KFP}." >> "$GITHUB_ENV"
            echo "Using the fixed signing key"
          else
            echo "KEYNOTE=Secret DEBUG_KEYSTORE_B64 was EMPTY in this run, so a random key was used." >> "$GITHUB_ENV"
            echo "No signing key secret found, so this build uses a random key"
          fi
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-turns-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FP=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          gh release create "apk-${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Shuttle Turns APK ${{ github.run_number }}" \
            --notes "Android debug APK. Open this file on your phone to install. ${KEYNOTE} Signed with key SHA-256: ${FP}"
