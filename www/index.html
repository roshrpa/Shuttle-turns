<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px system-ui,-apple-system,'Segoe UI',sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Shuttle Turns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Title on top, one working screen in the middle, fixed three-tab bar at the bottom.
   Play screen shows the players on court as large tiles; fixed-team mode shows both teams on a court diagram. */
:root{
  --bg:#eef3ee; --surface:#ffffff; --ink:#13201a; --muted:#587064; --line:#d6e0d8;
  --accent:#1c6b4f; --on-accent:#ffffff; --tab-active:#e1efe6;
  --court:#1c6b4f; --court-line:#dff3e7; --court-ink:#ffffff;
  --shuttle:#e0a100; --shuttle-bg:#fff3cf; --shuttle-ink:#6e4e00;
  --danger:#b3382c; --scrim:rgba(8,16,12,.55);
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1612; --surface:#16211b; --ink:#e8f0ea; --muted:#93a39a; --line:#26332b;
    --accent:#46b98a; --on-accent:#08130e; --tab-active:#1e3328;
    --court:#1d7355; --court-line:#d6efe0; --court-ink:#ffffff;
    --shuttle:#f5c542; --shuttle-bg:#34290a; --shuttle-ink:#f5c542;
    --danger:#ff8a7a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --ink:#e8f0ea; --muted:#93a39a; --line:#26332b;
  --accent:#46b98a; --on-accent:#08130e; --tab-active:#1e3328;
  --court:#1d7355; --court-line:#d6efe0; --court-ink:#ffffff;
  --shuttle:#f5c542; --shuttle-bg:#34290a; --shuttle-ink:#f5c542;
  --danger:#ff8a7a; color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.4 var(--font-body);
  padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px;margin:0 auto}
h1,h2,h3,p{margin:0}
.top{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.kicker{font:600 12px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:700 40px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h2{font:600 16px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.stack{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.next{background:var(--shuttle-bg);border-color:var(--shuttle)}
.card.next h2{color:var(--shuttle-ink)}
.card.empty{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
.card.empty p{max-width:34ch}

.btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 16px var(--font-body);cursor:pointer;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.btn.icon{min-width:40px;padding:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--muted);font:500 14px var(--font-body);text-decoration:underline;cursor:pointer;align-self:center}
:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}

.field{
  width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);font:500 16px var(--font-body);min-width:0;
}
.addrow{display:flex;gap:8px}
.addrow .btn{flex:none}
.teamform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.teamform .btn{grid-column:1/-1}
.msg{min-height:20px;font-size:14px;color:var(--danger);margin-top:6px}
.top{position:relative}
.ptsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--font-body);text-align:left;cursor:pointer}
.ptsrow small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.ptsrow[aria-disabled="true"]{cursor:not-allowed;opacity:.7}
.ptsrow .pill{flex:none;font:600 13px var(--font-body);padding:3px 10px;border-radius:99px;background:var(--tab-active);color:var(--ink)}
.ptsrow .pill.on{background:var(--accent);color:var(--on-accent)}
.ptab{margin:10px 0 4px;font-size:14px}
.ptab .ph,.ptab .pr{display:grid;grid-template-columns:24px 1fr 30px 30px 30px 44px 44px;gap:6px;align-items:center;padding:8px 0;text-align:center}
.ptab .ph{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.ptab .pr{border-bottom:1px solid var(--line)}
.ptab .n{text-align:left;font-weight:600;min-width:0}
.ptab .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ptab .rk{color:var(--muted);font-weight:600}
.scoreform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scoreform label{display:flex;flex-direction:column;gap:6px;font:600 13px var(--font-body);color:var(--muted);min-width:0}
.scoreform input{text-align:center;font-size:22px;font-weight:700}
.warn{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger);font:600 14px var(--font-body);display:flex;gap:10px;align-items:center;justify-content:space-between}
.warn .btn{border-color:var(--danger);color:var(--danger);flex:none}
.menu .mhead{font:600 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
.menu .seg{margin:0 6px 6px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.menu .pill{font:600 13px var(--font-body);padding:3px 10px;border-radius:99px;background:var(--tab-active);color:var(--ink)}
.menu .pill.on{background:var(--accent);color:var(--on-accent)}
.help h3{font:600 16px var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 4px}
.help p{margin:0 0 6px;color:var(--ink)}
.top h1{padding-right:54px;font-size:32px;white-space:nowrap}
.big .top h1{font-size:27px}
.menubtn{position:absolute;right:0;top:0;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu{position:absolute;right:0;top:50px;z-index:20;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:12px;font:600 15px var(--font-body);color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--tab-active)}
.lbl{display:flex;flex-direction:column;gap:6px;font:600 14px var(--font-body);color:var(--muted)}
textarea.field{height:auto;min-height:110px;padding-top:10px;font-family:inherit}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 14px var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button[aria-disabled="true"]{cursor:not-allowed}
.seg button[aria-disabled="true"]:not([aria-pressed="true"]){opacity:.5}

.plist{list-style:none;margin:8px 0 0;padding:0}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.off .pname{color:var(--muted)}
.pnum{font:600 20px var(--font-display);color:var(--muted);width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.pname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.note{background:var(--tab-active);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.note span{min-width:0}

.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt b{display:block}
.opt small{color:var(--muted);font-size:13px}
.switch{flex:none;width:52px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--line);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--muted)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:23px;border-color:var(--surface)}

.gamehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.gamehead h2{font:700 34px/1 var(--font-display);color:var(--ink);margin:0;letter-spacing:.03em}
.elapsed{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.onc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{
  background:var(--court);color:var(--court-ink);border-radius:12px;padding:30px 8px;text-align:center;
  font:700 clamp(22px,7vw,32px)/1.05 var(--font-display);overflow-wrap:anywhere;min-width:0;
}
.court{position:relative;border:3px solid var(--court-line);background:var(--court);border-radius:8px;overflow:hidden}
.half{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:116px}
.half::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--court-line);opacity:.8}
.half::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--court-line);opacity:.5}
.half.a::after{bottom:20px}
.half.b::after{top:20px}
.tag{position:absolute;left:8px;z-index:1;font:600 11px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--court-line)}
.half.a .tag{top:6px}
.half.b .tag{bottom:6px}
.net{height:12px;background:repeating-linear-gradient(90deg,var(--court-line) 0 6px,transparent 6px 9px);border-block:2px solid var(--court-line)}
.slot{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:30px 8px;font:700 clamp(22px,7vw,32px)/1.05 var(--font-display);color:var(--court-ink);overflow-wrap:anywhere;min-width:0;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;overflow-wrap:anywhere}
.rest{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.rest h3{font:600 13px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.versus{display:flex;flex-direction:column;gap:2px;font-weight:600}
.versus em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.next .rest h3{color:var(--shuttle-ink)}
.next .chip{background:var(--surface)}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--tab-active);color:var(--accent);white-space:nowrap}
.pill.rest-pill{background:var(--shuttle-bg);color:var(--shuttle-ink)}
.pill.left{background:var(--line);color:var(--muted)}
.frow{display:grid;grid-template-columns:minmax(84px,130px) 1fr auto 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.c{font:700 20px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.log li:first-child{border-top:0}
.log small{color:var(--muted)}

.srow{display:grid;grid-template-columns:minmax(84px,150px) 1fr 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sumhead{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.sumhead strong{font:700 30px/1.1 var(--font-display);letter-spacing:.02em}
.share{margin:14px 0 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:500 14px/1.5 var(--font-body);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:12px}

.trow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .c small{font:500 12px var(--font-body);color:var(--muted);margin-left:4px}
.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.champ{background:var(--court);color:var(--court-ink);border-radius:14px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.champ .lab{font:600 13px var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--court-line)}
.champ .cname{font:700 54px/1 var(--font-display);margin:0;letter-spacing:.02em;color:var(--court-ink)}
.champ p{color:var(--court-line);font-weight:600}
.scrim{
  position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.dialog{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.dialog h3{font:700 26px/1.1 var(--font-display);letter-spacing:.02em}
.dialog p{color:var(--muted)}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}

.nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tab{min-height:48px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 14px var(--font-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab.on{background:var(--tab-active);color:var(--accent)}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="kicker">Badminton · Doubles</p>
    <h1>Shuttle Turns</h1>
    <button id="menuBtn" class="menubtn" type="button" data-act="menutoggle" aria-label="Menu" aria-expanded="false" aria-controls="menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div id="menu" class="menu" hidden></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Sections">
  <div class="nav-inner">
    <button class="tab" data-tab="players" type="button">Players</button>
    <button class="tab" data-tab="play" type="button">Play</button>
    <button class="tab" data-tab="history" type="button">History</button>
  </div>
</nav>
<div id="modal"></div>

<script>
const KEY='shuttle-turns-v2';
const SAMPLE=['Arun','Basil','Chris','Dev','Eldho','Faisal','Gokul'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const inc=(m,k)=>{m[k]=(m[k]||0)+1;};

function fresh(){
  return {players:SAMPLE.map((n,i)=>({id:i+1,name:n,active:true,base:0})),nextId:SAMPLE.length+1,
    mode:'solo',teams:[],nextTid:1,games:[],cur:0,tour:null,pts:false,teamMode:false,ended:false,tab:'players',sample:true};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d||!Array.isArray(d.players)||!Array.isArray(d.games)) return null;
    d.teamMode=false;
    if(!d.tour||typeof d.tour!=='object'||!Array.isArray(d.tour.matches)||!Array.isArray(d.tour.ids)) d.tour=null;
    if(typeof d.ended!=='boolean') d.ended=false;
    d.pts=!!d.pts;
    if(typeof d.cur!=='number'||d.cur<0||d.cur>=d.games.length) d.cur=Math.max(0,d.games.length-1);
    if(!['teams','tour'].includes(d.mode)) d.mode='solo';
    if(!Array.isArray(d.teams)) d.teams=[];
    if(!d.nextTid) d.nextTid=d.teams.reduce((m,t)=>Math.max(m,t.id),0)+1;
    if(!d.nextId) d.nextId=d.players.reduce((m,p)=>Math.max(m,p.id),0)+1;
    if(!['players','play','history'].includes(d.tab)) d.tab='players';
    return d;
  }catch(e){return null;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load()||fresh();
let dialog=null;
let copyMsg='';
let contactOpen=false,helpOpen=false,modeNote=false,dropNote=false;
function scMsg(t){const el=$('#scMsg');if(el)el.textContent=t;}
function readScore(){
  const ea=$('#scA'),eb=$('#scB');
  const va=ea?String(ea.value).trim():'',vb=eb?String(eb.value).trim():'';
  if(va===''&&vb==='')return {empty:true};
  const a=Number(va),b=Number(vb);
  if(va===''||vb===''||!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>99||b>99)return {err:'Enter both scores as whole numbers.'};
  if(a===b)return {err:'A game cannot end in a draw. Check the scores.'};
  return {a,b};
}
const PK='shuttle-turns-prefs';
let P={theme:'system',big:false,awake:false};
try{const d=JSON.parse(localStorage.getItem(PK)||'null');if(d&&typeof d==='object'){if(['system','light','dark'].includes(d.theme))P.theme=d.theme;P.big=!!d.big;P.awake=!!d.awake;}}catch(e){}
function savePrefs(){try{localStorage.setItem(PK,JSON.stringify(P));}catch(e){}}
let wl=null;
const canWake=()=>!!(navigator.wakeLock&&navigator.wakeLock.request);
async function wake(){
  try{
    if(P.awake&&canWake()&&document.visibilityState==='visible'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}
    else if(!P.awake&&wl){await wl.release();wl=null;}
  }catch(e){wl=null;}
}
document.addEventListener('visibilitychange',wake);
function applyPrefs(){
  const r=document.documentElement;
  if(P.theme==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',P.theme);
  document.body.style.zoom=P.big?'1.15':'';r.classList.toggle('big',P.big);
  wake();
}
function renderMenu(){
  const seg=(k,label)=>`<button type="button" data-act="theme${k}" aria-pressed="${P.theme===k}">${label}</button>`;

async function sendContact(){

/* ---- rotation logic: individual players ---- */
function tally(upto){
  const c={},last={},partner={},opp={};
  S.players.forEach(p=>{c[p.id]=p.base||0;last[p.id]=-1;});
  S.games.slice(0,upto===undefined?S.games.length:upto).forEach((g,i)=>{
    g.teams.flat().forEach(id=>{c[id]=(c[id]||0)+1;last[id]=i;});
    const [t1,t2]=g.teams;
    inc(partner,key(t1[0],t1[1]));inc(partner,key(t2[0],t2[1]));
    t1.forEach(a=>t2.forEach(b=>inc(opp,key(a,b))));
  });
  return {c,last,partner,opp};
}
function minActiveCount(t){
  const a=S.players.filter(p=>p.active).map(p=>t.c[p.id]);
  return a.length?Math.min(...a):0;
}
function pickNext(){
  const t=tally();
  const act=S.players.filter(p=>p.active);
  if(act.length<4) return null;
  const order=new Map(S.players.map((p,i)=>[p.id,i]));
  const sorted=[...act].sort((a,b)=>t.c[a.id]-t.c[b.id]||t.last[a.id]-t.last[b.id]||order.get(a.id)-order.get(b.id));
  const fourIds=sorted.slice(0,4).map(p=>p.id).sort((x,y)=>order.get(x)-order.get(y));
  const bench=sorted.slice(4).map(p=>p.id);
  const [a,b,c,d]=fourIds;
  const options=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];
  const score=o=>{
    let s=(t.partner[key(o[0][0],o[0][1])]||0)*10+(t.partner[key(o[1][0],o[1][1])]||0)*10;
    o[0].forEach(x=>o[1].forEach(y=>{s+=(t.opp[key(x,y)]||0);}));
    return s;
  };
  let best=options[0],bs=Infinity;
  options.forEach(o=>{const s=score(o);if(s<bs){bs=s;best=o;}});
  return {teams:best,bench};
}

/* ---- rotation logic: fixed teams ---- */
function tallyT(upto){
  const c={},last={},meet={};
  S.teams.forEach(t=>{c[t.id]=t.base||0;last[t.id]=-1;});
  S.games.slice(0,upto===undefined?S.games.length:upto).forEach((g,i)=>{
    if(!g.tm)return;
    g.tm.forEach(tid=>{c[tid]=(c[tid]||0)+1;last[tid]=i;});
    inc(meet,key(g.tm[0],g.tm[1]));
  });
  return {c,last,meet};
}
function minTeamCount(t){
  const a=S.teams.filter(teamActive).map(x=>t.c[x.id]);
  return a.length?Math.min(...a):0;
}
function pickNextTeams(){
  const t=tallyT();
  const act=S.teams.filter(teamActive);
  if(act.length<2) return null;
  const order=new Map(S.teams.map((x,i)=>[x.id,i]));
  const sorted=[...act].sort((a,b)=>t.c[a.id]-t.c[b.id]||t.last[a.id]-t.last[b.id]||order.get(a.id)-order.get(b.id));
  const first=sorted[0];
  const lim=t.c[sorted[1].id];
  const cands=sorted.slice(1).filter(x=>t.c[x.id]===lim);
  let opp=cands[0];
  cands.forEach(x=>{if((t.meet[key(first.id,x.id)]||0)<(t.meet[key(first.id,opp.id)]||0))opp=x;});
  const tm=[first.id,opp.id];
  const benchT=sorted.filter(x=>x.id!==first.id&&x.id!==opp.id).map(x=>x.id);
  return {mode:'teams',tm,teams:[tmembers(tm[0]).slice(),tmembers(tm[1]).slice()],benchT,bench:benchT.flatMap(tmembers)};
}
const pickGame=()=>S.mode==='teams'?pickNextTeams():pickNext();

/* ---- summary ---- */
function ptsRows(){
  const isT=S.mode==='teams';
  const m=new Map();
  const ent=(id,name,sub)=>{if(!m.has(id))m.set(id,{name,sub,p:0,w:0,l:0,pf:0,pa:0});return m.get(id);};
  if(isT)S.teams.forEach(t=>ent(t.id,tname(t.id),rawPair(t.members)));else S.players.forEach(p=>ent(p.id,p.name,''));
  S.games.forEach(g=>{
    if(g.sa==null||g.sb==null)return;
    const sides=[{ids:isT?[g.tm[0]]:g.teams[0],f:g.sa,a:g.sb},{ids:isT?[g.tm[1]]:g.teams[1],f:g.sb,a:g.sa}];
    sides.forEach(sd=>sd.ids.forEach(id=>{
      const r=m.get(id)||ent(id,isT?tname(id):nm(id),'');
      r.p++;r.pf+=sd.f;r.pa+=sd.a;if(sd.f>sd.a)r.w++;else r.l++;
    }));
  });
  const order=[...m.keys()];
  return [...m.entries()].map(([id,r])=>({...r,id,d:r.pf-r.pa})).filter(r=>r.p>0).sort((x,y)=>y.w-x.w||y.d-x.d||y.pf-x.pf||order.indexOf(x.id)-order.indexOf(y.id));
}
const scoredGames=()=>S.games.filter(g=>g.sa!=null&&g.sb!=null).length;

function tableCanvas(spec){
  const W=1080,P=48,IW=W-2*P;
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const BODY="'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif",DISP="'Barlow Condensed','Arial Narrow',sans-serif";
  const rows=spec.rows,HEAD=250,TH=70,RH=spec.isT?112:92;
  const H=HEAD+30+TH+rows.length*RH+60+110;
  c.width=W;c.height=H;
  ctx.fillStyle='#eef3ee';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1c6b4f';ctx.fillRect(0,0,W,HEAD);
  ctx.textBaseline='alphabetic';
  ctx.fillStyle='#dff3e7';ctx.font=`600 28px ${BODY}`;ctx.fillText('BADMINTON \u00B7 DOUBLES',P,82);
  ctx.fillStyle='#ffffff';ctx.font=`700 96px ${DISP}`;ctx.fillText(spec.title,P,170);
  ctx.fillStyle='#dff3e7';ctx.font=`500 32px ${BODY}`;ctx.fillText(spec.sub,P,222);
  const cols=[{k:'p',l:'P',x:W-P-470},{k:'w',l:'W',x:W-P-385},{k:'l',l:'L',x:W-P-300},{k:'pf',l:'PTS',x:W-P-195},{k:'d',l:'+/-',x:W-P-60}];
  let y=HEAD+30;
  ctx.fillStyle='#1c6b4f';ctx.fillRect(P,y,IW,TH);
  ctx.fillStyle='#ffffff';ctx.font=`700 30px ${BODY}`;ctx.textAlign='left';ctx.fillText('#  NAME',P+22,y+46);
  ctx.textAlign='center';cols.forEach(co=>ctx.fillText(co.l,co.x,y+46));
  y+=TH;
  rows.forEach((r,i)=>{
    ctx.fillStyle=i===0?'#fff3cf':(i%2?'#f7faf7':'#ffffff');ctx.fillRect(P,y,IW,RH);
    ctx.strokeStyle='#d6e0d8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(P,y+RH);ctx.lineTo(P+IW,y+RH);ctx.stroke();
    ctx.textAlign='left';
    ctx.fillStyle='#587064';ctx.font=`700 36px ${DISP}`;ctx.fillText(String(i+1),P+22,y+(spec.isT?52:58));
    ctx.fillStyle='#13201a';ctx.font=`700 44px ${DISP}`;
    let nm2=r.name;const maxW=cols[0].x-40-(P+76);
    while(ctx.measureText(nm2).width>maxW&&nm2.length>3)nm2=nm2.slice(0,-1);
    if(nm2!==r.name)nm2=nm2.slice(0,-1)+'\u2026';
    ctx.fillText(nm2,P+76,y+(spec.isT?52:58));
    if(spec.isT&&r.sub){ctx.fillStyle='#587064';ctx.font=`500 28px ${BODY}`;let sb2=r.sub;while(ctx.measureText(sb2).width>maxW&&sb2.length>3)sb2=sb2.slice(0,-1);ctx.fillText(sb2,P+76,y+92);}
    ctx.textAlign='center';
    cols.forEach(co=>{
      let v=r[co.k];if(co.k==='d')v=(v>0?'+':'')+v;
      ctx.fillStyle=co.k==='pf'?'#1c6b4f':'#13201a';ctx.font=co.k==='pf'?`700 46px ${DISP}`:`600 40px ${DISP}`;
      ctx.fillText(String(v),co.x,y+(spec.isT?60:62));
    });
    y+=RH;
  });
  ctx.textAlign='left';ctx.fillStyle='#587064';ctx.font=`500 26px ${BODY}`;
  ctx.fillText('P played \u00B7 W won \u00B7 L lost \u00B7 PTS points scored \u00B7 +/- difference',P,y+46);
  ctx.fillText('Shuttle Turns',P,H-48);
  return c;
}
function logCanvas(spec){
  spec=spec||gameLogSpec();
  if(spec.table)return tableCanvas(spec);
  const W=1080,P=56,IW=W-2*P;
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const BODY="'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif",DISP="'Barlow Condensed','Arial Narrow',sans-serif";
  const wrap=(text,font,maxW)=>{
    ctx.font=font;const words=String(text).split(' ');const lines=[];let line='';
    words.forEach(w=>{const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
    if(line)lines.push(line);return lines;
  };
  const blocks=spec.blocks.map(b=>({
    n:b.n,
    who:[].concat(b.who).flatMap(t=>wrap(t,`700 44px ${DISP}`,IW)),
    rest:[].concat(b.rest||[]).flatMap(t=>wrap(t,`500 30px ${BODY}`,IW))
  }));
  const HEAD=250,GAP=34;
  let H=HEAD+30;
  blocks.forEach(b=>{b.h=26+34+8+b.who.length*52+10+b.rest.length*40+26;H+=b.h+GAP;});
  H+=110;
  c.width=W;c.height=H;
  ctx.fillStyle='#eef3ee';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1c6b4f';ctx.fillRect(0,0,W,HEAD);
  ctx.fillStyle='#dff3e7';ctx.font=`600 28px ${BODY}`;ctx.textBaseline='alphabetic';ctx.fillText('BADMINTON \u00B7 DOUBLES',P,82);
  ctx.fillStyle='#ffffff';ctx.font=`700 96px ${DISP}`;ctx.fillText(spec.title,P,170);
  ctx.fillStyle='#dff3e7';ctx.font=`500 32px ${BODY}`;ctx.fillText(spec.sub,P,222);
  let y=HEAD+30;
  blocks.forEach(b=>{
    ctx.fillStyle='#ffffff';ctx.fillRect(P,y,IW,b.h);
    ctx.fillStyle='#1c6b4f';ctx.fillRect(P,y,10,b.h);
    let ty=y+26+30;
    ctx.fillStyle='#587064';ctx.font=`600 28px ${BODY}`;ctx.fillText(b.n,P+34,ty);
    ty+=8+44;
    ctx.fillStyle='#13201a';ctx.font=`700 44px ${DISP}`;
    b.who.forEach(l=>{ctx.fillText(l,P+34,ty);ty+=52;});
    ty+=10-8;
    ctx.fillStyle='#587064';ctx.font=`500 30px ${BODY}`;
    b.rest.forEach(l=>{ctx.fillText(l,P+34,ty);ty+=40;});
    y+=b.h+GAP;
  });
  ctx.fillStyle='#587064';ctx.font=`500 26px ${BODY}`;ctx.fillText('Shuttle Turns',P,H-48);
  return c;
}

/* ---- tournament ---- */
const fullDate=()=>new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const tdesc=id=>`${tname(id)} (${rawPair(tmembers(id))})`;
const roundName=m=>({rr:'Round robin',sf:'Semi-final',f:'Final','3rd':'Third place'}[m.round]);
const resultLine=m=>{
  const l=m.w===m.a?m.b:m.a;
  return `${tname(m.w)} beat ${tname(l)}`+(m.sa!=null?` ${m.w===m.a?m.sa:m.sb}-${m.w===m.a?m.sb:m.sa}`:'');
};
function rrSchedule(ids){
  const t=ids.slice();if(t.length%2)t.push(null);
  const n=t.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!=null&&b!=null)out.push([a,b]);}
    t.splice(1,0,t.pop());
  }
  return out;
}
function standings(){
  const T=S.tour;
  const rows=T.ids.map(id=>({id,p:0,w:0,l:0,pf:0,pa:0}));
  const row=id=>rows.find(r=>r.id===id);
  T.matches.filter(m=>m.round==='rr'&&m.w!=null).forEach(m=>{
    const a=row(m.a),b=row(m.b);a.p++;b.p++;
    if(m.w===m.a){a.w++;b.l++;}else{b.w++;a.l++;}
    if(m.sa!=null&&m.sb!=null){a.pf+=m.sa;a.pa+=m.sb;b.pf+=m.sb;b.pa+=m.sa;}
  });
  rows.forEach(r=>{r.d=r.pf-r.pa;});
  const idx=id=>T.ids.indexOf(id);
  return rows.sort((x,y)=>y.w-x.w||y.d-x.d||y.pf-x.pf||idx(x.id)-idx(y.id));
}
function tourInfo(){
  const T=S.tour,ms=T.matches,n=T.ids.length;
  const rr=ms.filter(m=>m.round==='rr'),ko=ms.filter(m=>m.round!=='rr');
  const rrDone=rr.every(m=>m.w!=null);
  const cur=ms.find(m=>m.w==null)||null;
  const done=rrDone&&(n===2||(ko.some(m=>m.round==='f')&&ko.every(m=>m.w!=null)));
  return {n,rr,ko,rrDone,cur,st:standings(),done,needKo:rrDone&&n>=3&&ko.length===0};
}
function tourResults(){
  const I=tourInfo(),T=S.tour;if(!I.done)return null;
  if(I.n===2){const m=I.rr[0];return {champ:m.w,runner:m.w===m.a?m.b:m.a,third:null};}
  const f=T.matches.find(m=>m.round==='f'),tp=T.matches.find(m=>m.round==='3rd');
  return {champ:f.w,runner:f.w===f.a?f.b:f.a,third:tp?tp.w:(I.n===3?I.st[2].id:null)};
}
function startTour(){
  const ids=S.teams.map(t=>t.id);if(ids.length<2)return;
  const ms=rrSchedule(ids).map((pr,i)=>({id:i+1,a:pr[0],b:pr[1],round:'rr',w:null,sa:null,sb:null,t:null}));
  S.tour={ids,matches:ms,nextId:ms.length+1};
  S.tab='play';
}
function tourText(){
  const I=tourInfo(),T=S.tour,R=tourResults();
  let t=`\u{1F3F8} Badminton tournament, ${fullDate()}\n`;
  if(R)t+=`\nChampions: ${tdesc(R.champ)}\nRunner-up: ${tdesc(R.runner)}\n`+(R.third?`Third: ${tdesc(R.third)}\n`:'');
  t+='\nTable\n'+I.st.map((r,i)=>`${i+1}. ${tdesc(r.id)}: ${r.w}W ${r.l}L`+((r.pf||r.pa)?` (${r.d>0?'+':''}${r.d})`:'')).join('\n');
  const played=T.matches.filter(m=>m.w!=null);
  if(played.length)t+='\n\nResults\n'+played.map(m=>`${roundName(m)}: ${resultLine(m)}`).join('\n');
  return t;
}
const shareText=()=>S.mode==='tour'&&S.tour?tourText():summaryText();
function tourSpec(){
  const I=tourInfo(),T=S.tour,R=tourResults();
  const blocks=[];
  if(R)blocks.push({n:'CHAMPIONS',who:tdesc(R.champ),rest:['Runner-up: '+tdesc(R.runner)].concat(R.third?['Third: '+tdesc(R.third)]:[])});
  blocks.push({n:'TABLE',who:I.st.map((r,i)=>`${i+1}. ${tname(r.id)}  ${r.w}-${r.l}`+((r.pf||r.pa)?`  (${r.d>0?'+':''}${r.d})`:'')),rest:I.st.map(r=>`${tname(r.id)}: ${rawPair(tmembers(r.id))}`)});
  const played=T.matches.filter(m=>m.w!=null);
  if(played.length)blocks.push({n:'RESULTS',who:played.map(m=>`${roundName(m)}: ${resultLine(m)}`),rest:[]});
  return {title:'TOURNAMENT',sub:`${fullDate()} · ${R?'Final results':'Results so far'}`,blocks};
}

      ?court('Pair 1','Pair 2')
      :`<div class="onc" role="group" aria-label="Game ${n} players">${four(cur).map(id=>`<div class="pl">${esc(nm(id))}</div>`).join('')}</div>`;
    restNow=cur.bench.length?chips(cur.bench):'<span class="muted">Nobody. All active players are on court.</span>';
    nextBody=nxt?(S.teamMode
      ?`<div class="versus"><span>${pair(nxt.teams[0])}</span><em>vs</em><span>${pair(nxt.teams[1])}</span></div>`
      :`<div class="chips">${chips(four(nxt))}</div>`):'';
    restNext=nxt?chips(nxt.bench):'';
    noNext='At least 4 active players are needed for the next game. Tap Back on the Players tab for anyone returning.';
    switchCard='';
  }
  const nextCard=nxt
    ?`<section class="card next">
        <h2>Up next · Game ${n+1}</h2>
        ${nextBody}
        <div class="rest"><h3>Resting then</h3><div class="chips">${restNext||'<span class="muted">Nobody</span>'}</div></div>
      </section>`
    :`<section class="card next"><h2>Up next</h2><p>${noNext}</p></section>`;
  const later=planned.slice(1);
  const laterCard=later.length?`<section class="card"><h2>Planned after that</h2><ul class="log">${later.map((g,i)=>`<li><span><b>Game ${n+2+i}</b> \u00B7 ${esc(gameWho(g))}</span><small>${esc(gameRest(g))}</small></li>`).join('')}</ul></section>`:'';
  return `<div class="stack">
    <section>
      <div class="gamehead"><h2>Game ${n}</h2><span class="elapsed" id="elapsed">${elapsed(cur.at)}</span></div>
      ${onCourt}
      <div class="rest"><h3>Resting now</h3><div class="chips">${restNow}</div></div>
    </section>
    ${S.pts?`<section class="card">
      <h2>Game ${n} score</h2>
      <div class="scoreform">
        <label>${esc(isT?tname(cur.tm[0]):rawPair(cur.teams[0]))}<input id="scA" class="field" type="number" inputmode="numeric" min="0" max="99" value="${cur.sa!=null?cur.sa:''}" placeholder="0"></label>
        <label>${esc(isT?tname(cur.tm[1]):rawPair(cur.teams[1]))}<input id="scB" class="field" type="number" inputmode="numeric" min="0" max="99" value="${cur.sb!=null?cur.sb:''}" placeholder="0"></label>
      </div>
      <p class="msg" id="scMsg" role="status"></p>
      <p class="hint" style="margin:0">Enter the final score, then tap Next game or End games.</p>
    </section>`:''}
    <button class="btn primary block" type="button" data-act="nextgame" ${nxt?'':'disabled'}>Next game</button>
    ${nextCard}
    ${laterCard}
    ${switchCard}
    <button class="btn block" type="button" data-act="end">End games for today</button>
    ${n>1?`<button class="linkbtn" type="button" data-act="prev">Previous game</button>`:''}
  </div>`;
}
function viewHistory(){
  if(S.mode==='tour')return viewTourHistory();
  if(!S.games.length){
    return `<div class="card empty"><h2 style="margin:0">No games yet</h2><p class="muted">Every game, and who played in it, will be listed here once the session starts.</p></div>`;
  }
  const isT=S.mode==='teams';
  const cur=S.games[S.cur];
  const frow=(label,sub,c,max,st)=>`<div class="frow"><span class="n">${esc(label)}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="bar"><i style="width:${Math.round(c/max*100)}%"></i></span>${st}<span class="c">${c}</span></div>`;
  const stOn='<span class="pill">On court</span>',stRest='<span class="pill rest-pill">Resting</span>',stLeft='<span class="pill left">Left</span>';
  let rows,spread;
  if(isT){
    const t=tallyT(S.cur+1);
    const onC=new Set(cur.tm||[]);
    const max=Math.max(1,...S.teams.map(x=>t.c[x.id]));
    const act=S.teams.filter(teamActive).map(x=>t.c[x.id]);
    spread=act.length?Math.max(...act)-Math.min(...act):0;
    rows=S.teams.map(x=>frow(tname(x.id),rawPair(x.members),t.c[x.id],max,!teamActive(x)?stLeft:onC.has(x.id)?stOn:stRest)).join('');
  }else{
    const t=tally(S.cur+1);
    const onC=new Set(cur.teams.flat());
    const max=Math.max(1,...S.players.map(p=>t.c[p.id]));
    const act=S.players.filter(p=>p.active).map(p=>t.c[p.id]);
    spread=act.length?Math.max(...act)-Math.min(...act):0;
    rows=S.players.map(p=>frow(p.name,'',t.c[p.id],max,!p.active?stLeft:onC.has(p.id)?stOn:stRest)).join('');
  }
  const unit=isT?'team':'player';
  const summary=spread<=1
    ?`<span class="pill">Even</span><span class="muted">Every ${unit} is within 1 turn of each other.</span>`
    :`<span class="pill rest-pill">Gap of ${spread}</span><span class="muted">Whoever rested will play next.</span>`;
  const log=S.games.map((g,i)=>`<li><span><b>Game ${i+1}</b> \u00B7 ${esc(gameWho(g))}${g.sa!=null?` <b>${g.sa}-${g.sb}</b>`:''}${!S.ended&&i===S.cur?' <span class="pill">On court</span>':''}${i>S.cur?' <span class="pill rest-pill">Planned</span>':''}</span><small>${esc(gameRest(g))}</small></li>`).join('');
  return `<div class="stack">
    ${S.ended?summaryCard():''}
    <section class="card">
      <h2>Game log</h2>
      <ul class="log">${log}</ul>
      <div class="btns">
        <button class="btn primary block" type="button" data-act="shareimg">Share game log as image</button>
        <p class="hint" id="shareMsg" role="status" style="margin:0;text-align:center">${esc(shareMsg)}</p>
      </div>
    </section>
    ${S.ended?'':`<section class="card">
      <h2>Turns per ${unit}</h2>
      <div class="summary">${summary}</div>
      ${rows}
      <p class="hint">Counts include the game on court. Late arrivals start level with the lowest count.</p>
    </section>`}
  </div>`;
}
function dialogHtml(){
  if(!dialog)return '';
  if(dialog==='image')return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">Game log image</h3><img src="${imageUrl}" alt="Game log" style="width:100%;border-radius:8px;max-height:60vh;object-fit:contain;background:#fff"><p>Press and hold the image to save or share it.</p><button class="btn primary" type="button" data-act="cancel">Close</button></div></div>`;
  const d=dialog==='end'
    ?{t:'End games for today?',b:(S.pts&&dropNote?`Game ${S.cur+1} has no score, so it will not be counted. `:'')+'This closes the session and shows the summary to share.',y:'End games',a:'confirmend'}
    :{t:S.tour?'Reset the tournament?':'Start a new session?',b:S.tour?'This clears all matches and results. Players and teams stay.':'This clears all games from the current session.',y:'Yes, clear',a:'confirmreset'};
  return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${d.t}</h3><p>${d.b}</p><div class="dbtns"><button class="btn" type="button" data-act="cancel">Cancel</button><button class="btn primary" type="button" data-act="${d.a}">${d.y}</button></div></div></div>`;
}
function render(){
  $('#view').innerHTML=helpOpen?viewHelp():contactOpen?viewContact():S.tab==='play'?viewPlay():S.tab==='history'?viewHistory():viewPlayers();
  document.querySelectorAll('.tab').forEach(b=>{
    const on=!contactOpen&&!helpOpen&&b.dataset.tab===S.tab;
    b.classList.toggle('on',on);
    b.setAttribute('aria-current',on?'page':'false');
  });
  $('#modal').innerHTML=dialogHtml();
  if(dialog){const cb=document.querySelector('#modal [data-act="cancel"]');if(cb)cb.focus();}
  save();
}

/* ---- actions ---- */
function addPlayer(name){
  dropPlanned();
  const t=tally(S.cur+1);
  const base=S.games.length?minActiveCount(t):0;
  S.players.push({id:S.nextId++,name,active:true,base});
  S.sample=false;
}
function addTeam(a,b){
  dropPlanned();
  const base=S.games.length?minTeamCount(tallyT(S.cur+1)):0;
  S.teams.push({id:S.nextTid++,members:[a,b],base});
  S.sample=false;
}
function autopair(){
  const assigned=new Set(S.teams.flatMap(x=>x.members));
  const free=S.players.filter(p=>p.active&&!assigned.has(p.id));
  for(let i=0;i+1<free.length;i+=2)addTeam(free[i].id,free[i+1].id);
}
const actions={
  start(){if(S.mode==='tour'){startTour();return;}const g=pickGame();if(!g)return;S.games=[{...g,at:Date.now()}];S.cur=0;S.tab='play';},
  nextgame(){
    if(S.ended)return;
    if(S.pts){const r=readScore();if(r.err){scMsg(r.err);return false;}if(r.empty){scMsg('Enter the score of this game first.');return false;}S.games[S.cur].sa=r.a;S.games[S.cur].sb=r.b;}
    if(S.cur+1<S.games.length){S.cur++;}
    else{const g=pickGame();if(!g)return;S.games.push({...g,at:Date.now()});S.cur=S.games.length-1;}
    S.games[S.cur].at=Date.now();
  },
  prev(){if(S.cur>0)S.cur--;},
  shareimg(){shareImage();},
  suggest(){S.teamMode=!S.teamMode;},
  togglepts(){if(!S.games.length&&!S.tour)S.pts=!S.pts;else modeNote=true;},
  modeSolo(){if(!S.games.length&&!S.tour)S.mode='solo';else modeNote=true;},
  modeTeams(){if(!S.games.length&&!S.tour){S.mode='teams';if(!S.teams.length)autopair();}else modeNote=true;},
  modeTour(){if(!S.games.length&&!S.tour){S.mode='tour';if(!S.teams.length)autopair();}else modeNote=true;},
  startko(){
    if(!S.tour)return;const I=tourInfo();if(!I.needKo)return;
    const ids=I.st.map(r=>r.id),T=S.tour;
    const add=(a,b,round)=>T.matches.push({id:T.nextId++,a,b,round,w:null,sa:null,sb:null,t:null});
    if(I.n>=4){add(ids[0],ids[3],'sf');add(ids[1],ids[2],'sf');}else add(ids[0],ids[1],'f');
  },
  win(tid){
    if(!S.tour)return false;
    const I=tourInfo(),m=I.cur,T=S.tour;
    if(!m||(tid!==m.a&&tid!==m.b))return false;
    const msg=t=>{const el=$('#tourMsg');if(el)el.textContent=t;};
    const ea=$('#sa'),eb=$('#sb');
    const va=ea?String(ea.value).trim():'',vb=eb?String(eb.value).trim():'';
    let sa=null,sb=null;
    if(S.pts&&(va===''||vb==='')){msg('Enter the score of both teams first.');return false;}
    if(va!==''||vb!==''){
      const na=Number(va),nb=Number(vb);
      if(va===''||vb===''||!Number.isInteger(na)||!Number.isInteger(nb)||na<0||nb<0){msg('Enter both scores as whole numbers, or leave both empty.');return false;}
      const mine=tid===m.a?na:nb,theirs=tid===m.a?nb:na;
      if(mine<=theirs){msg('The winner needs the higher score.');return false;}
      sa=na;sb=nb;
    }
    T.seq=(T.seq||0)+1;m.w=tid;m.sa=sa;m.sb=sb;m.t=T.seq;
    const sfs=T.matches.filter(x=>x.round==='sf');
    if(sfs.length===2&&sfs.every(x=>x.w!=null)&&!T.matches.some(x=>x.round==='f')){
      const lose=x=>x.w===x.a?x.b:x.a;
      T.matches.push({id:T.nextId++,a:lose(sfs[0]),b:lose(sfs[1]),round:'3rd',w:null,sa:null,sb:null,t:null});
      T.matches.push({id:T.nextId++,a:sfs[0].w,b:sfs[1].w,round:'f',w:null,sa:null,sb:null,t:null});
    }
  },
  undoresult(){
    if(!S.tour)return;
    const T=S.tour;
    const m=T.matches.filter(x=>x.w!=null).sort((x,y)=>y.t-x.t)[0];if(!m)return;
    m.w=null;m.sa=null;m.sb=null;m.t=null;
    if(m.round==='rr')T.matches=T.matches.filter(x=>x.round==='rr');
    if(m.round==='sf')T.matches=T.matches.filter(x=>!((x.round==='f'||x.round==='3rd')&&x.w==null));
  },
  autopair(){autopair();},
  removeteam(id){S.teams=S.teams.filter(x=>x.id!==id);},
  end(){
    dropNote=false;
    if(S.pts){
      const r=readScore();
      if(r.err){scMsg(r.err);return false;}
      if(r.empty){if(S.cur===0){scMsg('Enter the score of this game first.');return false;}dropNote=true;}
      else{S.games[S.cur].sa=r.a;S.games[S.cur].sb=r.b;}
    }
    dialog='end';
  },
  confirmend(){dialog=null;copyMsg='';if(S.pts&&dropNote){S.games.length=S.cur;S.cur=Math.max(0,S.games.length-1);}else dropPlanned();dropNote=false;S.ended=true;S.endedAt=Date.now();S.tab='history';},
  reopen(){S.ended=false;S.endedAt=null;copyMsg='';S.tab='play';},
  copy(){
    const text=shareText();
    const say=m=>{copyMsg=m;const el=$('#copyMsg');if(el)el.textContent=m;};
    const fail=()=>{
      say('Copy was blocked. Select the text above and copy it.');
      const pre=$('#sumText');
      if(pre&&window.getSelection){try{const r=document.createRange();r.selectNodeContents(pre);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);}catch(e){}}
    };
    try{navigator.clipboard.writeText(text).then(()=>say('Copied. Paste it in the group.'),fail);}catch(e){fail();}
  },
  up(id){const i=S.players.findIndex(p=>p.id===id);if(i>0){const [p]=S.players.splice(i,1);S.players.splice(i-1,0,p);S.sample=false;}},
  remove(id){S.players=S.players.filter(p=>p.id!==id);S.teams=S.teams.filter(x=>!x.members.includes(id));S.sample=false;},
  clear(){S.players=[];S.teams=[];S.sample=false;},
  toggle(id){
    const p=S.players.find(p=>p.id===id);if(!p)return;
    dropPlanned();
    if(p.active){p.active=false;return;}
    if(S.mode==='teams'){
      const tt=tallyT();
      const was=new Set(S.teams.filter(teamActive).map(x=>x.id));
      const minB=minTeamCount(tt);
      p.active=true;
      S.teams.forEach(x=>{if(teamActive(x)&&!was.has(x.id)){const need=minB-tt.c[x.id];if(need>0)x.base=(x.base||0)+need;}});
    }else{
      const t=tally();const need=minActiveCount(t)-t.c[id];if(need>0)p.base=(p.base||0)+need;p.active=true;
    }
  },
  reset(){dialog='reset';},
  menutoggle(){const m=$('#menu');if(m.hidden)renderMenu();m.hidden=!m.hidden;$('#menuBtn').setAttribute('aria-expanded',String(!m.hidden));return false;},
  ...Object.fromEntries(['system','light','dark'].map(k=>['theme'+k,()=>{P.theme=k;savePrefs();applyPrefs();renderMenu();return false;}])),
  bigtext(){P.big=!P.big;savePrefs();applyPrefs();renderMenu();return false;},
  awake(){P.awake=!P.awake;savePrefs();wake();renderMenu();return false;},
  helpopen(){closeMenu();window.scrollTo(0,0);contactOpen=false;helpOpen=true;},
  helpclose(){helpOpen=false;},
  contactopen(){closeMenu();window.scrollTo(0,0);helpOpen=false;contactOpen=true;if(cst.s==='sent')cst={s:'idle',m:''};},
  contactclose(){contactOpen=false;},
  contactnew(){cst={s:'idle',m:''};},
  gotoreset(){window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});return false;},
  confirmreset(){dialog=null;modeNote=false;S.tour=null;S.games=[];S.cur=0;S.ended=false;S.endedAt=null;copyMsg='';S.players.forEach(p=>{p.base=0;p.active=true;});S.teams.forEach(x=>{x.base=0;});S.tab='players';},
  cancel(){dialog=null;dropNote=false;}
};
document.addEventListener('click',e=>{
  if(!e.target.closest('#menu,#menuBtn'))closeMenu();
  const el=e.target.closest('[data-tab],[data-act]');if(!el)return;
  if(el.dataset.tab){contactOpen=false;helpOpen=false;S.tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
  const f=actions[el.dataset.act];
  if(f){const r=f(el.dataset.id?+el.dataset.id:undefined);if(r!==false&&!['copy','shareimg'].includes(el.dataset.act))render();if(r!==false&&['start','nextgame','prev','confirmend','confirmreset','win','startko'].includes(el.dataset.act))window.scrollTo(0,0);}
});
document.addEventListener('submit',e=>{
  if(!e.target)return;
  if(e.target.id==='contactForm'){
    e.preventDefault();
    if($('#cHoney').value)return;
    cd={kind:$('#cKind').value,contact:$('#cContact').value.trim(),msg:$('#cMsg').value.trim()};
    const okC=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cd.contact)||cd.contact.replace(/\D/g,'').length>=6;
    if(!okC){cst={s:'error',m:'Enter a valid phone number or email.'};render();return;}
    if(cd.msg.length<5){cst={s:'error',m:'Please write your request.'};render();return;}
    sendContact();return;
  }
  if(e.target.id==='addForm'){
    e.preventDefault();
    const inp=$('#nameIn');const name=inp.value.trim();if(!name)return;
    if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
      $('#addMsg').textContent='That name is already on the list.';return;
    }
    addPlayer(name);render();
    const again=$('#nameIn');if(again)again.focus();
  }else if(e.target.id==='teamForm'){
    e.preventDefault();
    const a=+$('#tp1').value,b=+$('#tp2').value;
    if(!a||!b||a===b){$('#teamMsg').textContent='Pick two different players.';return;}
    addTeam(a,b);render();
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog=null;render();}});
setInterval(()=>{
  const el=$('#elapsed');
  if(el&&S.games.length&&S.games[S.cur])el.textContent=elapsed(S.games[S.cur].at);
},20000);
applyPrefs();
render();
</script>
