<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px system-ui,-apple-system,'Segoe UI',sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Shuttle Turns</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Title on top, one working screen in the middle, fixed three-tab bar at the bottom.
   Play screen shows the players on court as large tiles; fixed-team mode shows both teams on a court diagram. */
:root{
  --bg:#eef3ee; --surface:#ffffff; --ink:#13201a; --muted:#587064; --line:#d6e0d8;
  --accent:#1c6b4f; --on-accent:#ffffff; --tab-active:#e1efe6;
  --court:#1c6b4f; --court-line:#dff3e7; --court-ink:#ffffff;
  --shuttle:#e0a100; --shuttle-bg:#fff3cf; --shuttle-ink:#6e4e00;
  --danger:#b3382c; --scrim:rgba(8,16,12,.55);
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1612; --surface:#16211b; --ink:#e8f0ea; --muted:#93a39a; --line:#26332b;
    --accent:#46b98a; --on-accent:#08130e; --tab-active:#1e3328;
    --court:#1d7355; --court-line:#d6efe0; --court-ink:#ffffff;
    --shuttle:#f5c542; --shuttle-bg:#34290a; --shuttle-ink:#f5c542;
    --danger:#ff8a7a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1612; --surface:#16211b; --ink:#e8f0ea; --muted:#93a39a; --line:#26332b;
  --accent:#46b98a; --on-accent:#08130e; --tab-active:#1e3328;
  --court:#1d7355; --court-line:#d6efe0; --court-ink:#ffffff;
  --shuttle:#f5c542; --shuttle-bg:#34290a; --shuttle-ink:#f5c542;
  --danger:#ff8a7a; color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.4 var(--font-body);
  padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px;margin:0 auto}
h1,h2,h3,p{margin:0}
.top{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.kicker{font:600 12px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:700 40px/1 var(--font-display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h2{font:600 16px/1.2 var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:14px;margin-top:10px}
.stack{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.next{background:var(--shuttle-bg);border-color:var(--shuttle)}
.card.next h2{color:var(--shuttle-ink)}
.card.empty{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
.card.empty p{max-width:34ch}

.btn{
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
  min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:600 16px var(--font-body);cursor:pointer;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.block{width:100%}
.payfields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.payfields .field{padding:0 10px}
.lbl{display:flex;flex-direction:column;gap:4px;font:600 13px var(--font-body);color:var(--muted)}
.payrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.gck{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--font-body);color:var(--muted)}.gck input{width:18px;height:18px}.gline{padding:4px 0 10px}.gline label{display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 13px var(--font-body);color:var(--muted)}.gline .field{width:110px;min-height:40px}.payitem{border-bottom:1px solid var(--line)}.payitem .payrow{border-bottom:0}.chip.unpaid{border-color:var(--danger);color:var(--danger)}.chip .x,.pk.no{color:var(--danger);font-weight:700}.pk.ok{color:var(--accent);font-weight:700}
.pendbtn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;padding:0 8px;border:1px solid var(--danger);border-radius:12px;background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger);font:700 15px/1.1 var(--font-body);cursor:pointer}.pendbtn small{font-size:11px;font-weight:600}
.sesitem{display:flex;flex-direction:column}.pendlink{margin-top:6px;align-self:flex-start;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--surface));color:var(--danger);border-radius:999px;min-height:36px;padding:0 14px;font:600 13px var(--font-body);cursor:pointer}
.payrow .who{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.payrow .sub{margin:12px 0 2px;font:700 12px var(--font-body);text-transform:uppercase;color:var(--muted)}.chip.gst{min-height:30px;padding:0 10px;font-size:12px;opacity:.75}.chip.gst.sel{opacity:1}.payrow .chip{cursor:pointer}.payrow.off .chip{opacity:.5;text-decoration:line-through}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:10px}.stepper b{min-width:52px;text-align:center}
.payh,.payr{display:grid;grid-template-columns:minmax(90px,1fr) 56px 104px;gap:4px;align-items:center;padding:8px 0;font-size:15px}
.payh{font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;border-bottom:2px solid var(--line)}
.payr{border-bottom:1px solid var(--line)}.payr .n small{display:block;color:var(--muted);font-size:12px}
.payh span:not(.n),.payr span:not(.n){text-align:right}
.paidlist{margin-top:12px}.prow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.pn{font-weight:700}.pn small{display:block;font-weight:500;color:var(--muted);font-size:13px}.pst{min-height:44px;min-width:128px;padding:0 14px;border-radius:12px;font:700 14px var(--font-body);cursor:pointer}.pst.no{border:1px solid var(--danger);background:var(--surface);color:var(--danger)}.pst.yes{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}.paidlist .chip{margin:4px 6px 0 0;cursor:pointer}
.okbox{padding:10px 12px;border-radius:10px;border:1px solid var(--accent);color:var(--accent)}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.btn.icon{min-width:40px;padding:0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:10px 4px;color:var(--muted);font:500 14px var(--font-body);text-decoration:underline;cursor:pointer;align-self:center}
:focus-visible{outline:3px solid var(--shuttle);outline-offset:2px}

.field{
  width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--ink);font:500 16px var(--font-body);min-width:0;
}
.addrow{display:flex;gap:8px}
.addrow .btn{flex:none}
.teamform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.teamform .btn{grid-column:1/-1}
.msg{min-height:20px;font-size:14px;color:var(--danger);margin-top:6px}
.top{position:relative}
.ptsrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 15px var(--font-body);text-align:left;cursor:pointer}
.ptsrow small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.ptsrow[aria-disabled="true"]{cursor:not-allowed;opacity:.7}
.ptsrow .pill{flex:none;font:600 13px var(--font-body);padding:3px 10px;border-radius:99px;background:var(--tab-active);color:var(--ink)}
.ptsrow .pill.on{background:var(--accent);color:var(--on-accent)}
.ptab{margin:10px 0 4px;font-size:14px}
.ptab .ph,.ptab .pr{display:grid;grid-template-columns:18px minmax(96px,1fr) 22px 22px 22px 36px 40px;gap:4px;align-items:center;padding:8px 0;text-align:center}
.ptab .ph{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.ptab .pr{border-bottom:1px solid var(--line)}
.ptab.nopts .ph,.ptab.nopts .pr{grid-template-columns:18px minmax(96px,1fr) 30px 30px 30px}
.ptab .n{text-align:left;font-weight:600;min-width:0;overflow-wrap:break-word;word-break:normal}
.big .ptab{font-size:13px}
.ptab .n small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.ptab .rk{color:var(--muted);font-weight:600}
.scoreform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scoreform label{display:flex;flex-direction:column;gap:6px;font:600 13px var(--font-body);color:var(--muted);min-width:0}
.scoreform input{text-align:center;font-size:22px;font-weight:700}
.warn{margin-top:12px;padding:10px 12px;border-radius:10px;border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger);font:600 14px var(--font-body);display:flex;gap:10px;align-items:center;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:520px;z-index:30;padding:12px 14px;border-radius:12px;background:var(--danger);color:var(--on-accent,#fff);font:600 14px var(--font-body);display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast[hidden]{display:none}
.toast .btn{flex:none;background:transparent;color:inherit;border-color:currentColor}
.chip.left{opacity:.6;text-decoration:line-through}
.warn .btn{border-color:var(--danger);color:var(--danger);flex:none}
.menu .mhead{font:600 12px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
.menu .seg{margin:0 6px 6px}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.menu .pill{font:600 13px var(--font-body);padding:3px 10px;border-radius:99px;background:var(--tab-active);color:var(--ink)}
.menu .pill.on{background:var(--accent);color:var(--on-accent)}
.help h3{font:600 16px var(--font-display);letter-spacing:.08em;text-transform:uppercase;margin:14px 0 4px}
.help p{margin:0 0 6px;color:var(--ink)}
.top h1{padding-right:54px;font-size:32px;white-space:nowrap}
.big .top h1{font-size:27px}
.menubtn{position:absolute;right:0;top:0;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu{position:absolute;right:0;top:50px;z-index:20;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:12px;font:600 15px var(--font-body);color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--tab-active)}
.lbl{display:flex;flex-direction:column;gap:6px;font:600 14px var(--font-body);color:var(--muted)}
textarea.field{height:auto;min-height:110px;padding-top:10px;font-family:inherit}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:600 14px var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button[aria-disabled="true"]{cursor:not-allowed}
.seg button[aria-disabled="true"]:not([aria-pressed="true"]){opacity:.5}

.plist{list-style:none;margin:8px 0 0;padding:0}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.off .pname{color:var(--muted)}
.pnum{font:600 20px var(--font-display);color:var(--muted);width:22px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.pname{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.pname small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.note{background:var(--tab-active);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.note span{min-width:0}

.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt b{display:block}
.opt small{color:var(--muted);font-size:13px}
.switch{flex:none;width:52px;height:32px;border-radius:999px;border:1px solid var(--line);background:var(--line);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:1px solid var(--muted)}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:23px;border-color:var(--surface)}

.gamehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.gamehead h2{font:700 34px/1 var(--font-display);color:var(--ink);margin:0;letter-spacing:.03em}
.elapsed{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.onc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{
  background:var(--court);color:var(--court-ink);border-radius:12px;padding:30px 8px;text-align:center;
  font:700 clamp(22px,7vw,32px)/1.05 var(--font-display);overflow-wrap:anywhere;min-width:0;
}
.court{position:relative;border:3px solid var(--court-line);background:var(--court);border-radius:8px;overflow:hidden}
.half{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:116px}
.half::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:var(--court-line);opacity:.8}
.half::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--court-line);opacity:.5}
.half.a::after{bottom:20px}
.half.b::after{top:20px}
.tag{position:absolute;left:8px;z-index:1;font:600 11px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--court-line)}
.half.a .tag{top:6px}
.half.b .tag{bottom:6px}
.net{height:12px;background:repeating-linear-gradient(90deg,var(--court-line) 0 6px,transparent 6px 9px);border-block:2px solid var(--court-line)}
.slot{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:30px 8px;font:700 clamp(22px,7vw,32px)/1.05 var(--font-display);color:var(--court-ink);overflow-wrap:anywhere;min-width:0;
}
.pickp{border:0;background:transparent;cursor:pointer;width:100%;font-family:inherit}
.pickc{cursor:pointer;font-family:inherit;font-size:inherit;color:inherit}
.pickc.sel{outline:3px solid var(--shuttle);background:var(--shuttle-bg)}
.pickp.sel{outline:4px solid var(--shuttle);outline-offset:-6px;border-radius:10px;background:rgba(255,255,255,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:600;overflow-wrap:anywhere}
.rest{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.rest h3{font:600 13px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.versus{display:flex;flex-direction:column;gap:2px;font-weight:600}
.versus em{font-style:normal;font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.next .rest h3{color:var(--shuttle-ink)}
.next .chip{background:var(--surface)}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--tab-active);color:var(--accent);white-space:nowrap}
.pill.rest-pill{background:var(--shuttle-bg);color:var(--shuttle-ink)}
.pill.left{background:var(--line);color:var(--muted)}
.frow{display:grid;grid-template-columns:minmax(84px,130px) 1fr auto 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.c{font:700 20px var(--font-display);text-align:right;font-variant-numeric:tabular-nums}
.summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.log li:first-child{border-top:0}
.log small{color:var(--muted)}

.srow{display:grid;grid-template-columns:minmax(84px,150px) 1fr 28px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sumhead{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.sumhead strong{font:700 30px/1.1 var(--font-display);letter-spacing:.02em}
.share{margin:14px 0 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font:500 14px/1.5 var(--font-body);white-space:pre-wrap;overflow-wrap:anywhere;user-select:text}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:12px}

.trow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.trow .c small{font:500 12px var(--font-body);color:var(--muted);margin-left:4px}
.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.champ{background:var(--court);color:var(--court-ink);border-radius:14px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.champ .lab{font:600 13px var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--court-line)}
.champ .cname{font:700 54px/1 var(--font-display);margin:0;letter-spacing:.02em;color:var(--court-ink)}
.champ p{color:var(--court-line);font-weight:600}
.scrim{
  position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.dialog{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.dialog h3{font:700 26px/1.1 var(--font-display);letter-spacing:.02em}
.dialog p{color:var(--muted)}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}

.nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.nav-inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

<script>
const KEY='shuttle-turns-v2';
const SAMPLE=['Arun','Basil','Chris','Dev','Eldho','Faisal','Gokul'];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const inc=(m,k)=>{m[k]=(m[k]||0)+1;};

function fresh(){
  return {players:SAMPLE.map((n,i)=>({id:i+1,name:n,active:true,base:0})),nextId:SAMPLE.length+1,
    mode:'solo',teams:[],nextTid:1,games:[],cur:0,tour:null,pts:false,teamMode:false,ended:false,tab:'players',sample:true,pay:payDefault(),guestFee:'2',shuffle:true,seed:Math.floor(Math.random()*2147483647)};
}
function load(){try{const raw=localStorage.getItem(KEY);return raw?normalize(JSON.parse(raw)):null;}catch(e){return null;}}
function normalize(d){
  try{
    if(!d||!Array.isArray(d.players)||!Array.isArray(d.games)) return null;
    d.teamMode=false;
    if(!d.tour||typeof d.tour!=='object'||!Array.isArray(d.tour.matches)||!Array.isArray(d.tour.ids)) d.tour=null;
    if(typeof d.ended!=='boolean') d.ended=false;
    d.pts=!!d.pts;
    if(typeof d.cur!=='number'||d.cur<0||d.cur>=d.games.length) d.cur=Math.max(0,d.games.length-1);
    if(!['teams','tour'].includes(d.mode)) d.mode='solo';
    if(!Array.isArray(d.teams)) d.teams=[];
    if(!d.nextTid) d.nextTid=d.teams.reduce((m,t)=>Math.max(m,t.id),0)+1;
    if(!d.nextId) d.nextId=d.players.reduce((m,p)=>Math.max(m,p.id),0)+1;
    if(!['players','play','history','pay'].includes(d.tab)) d.tab='players';
    if(typeof d.guestFee!=='string')d.guestFee='2';
    d.shuffle=true;
    if(typeof d.seed!=='number')d.seed=Math.floor(Math.random()*2147483647);
    if(!d.pay||typeof d.pay!=='object')d.pay=payDefault();else d.pay={...payDefault(),...d.pay};
    return d;
  }catch(e){return null;}
}
/* ---- payments ---- */
function payDefault(){return {court:'',hours:'',shuttle:'',admin:0,hrs:{},out:{},paid:{},round:false,final:false,guest:{}};}
const fmtM=(v,rd)=>v.toFixed(2)+' AED';
const payH=(id,H)=>{const v=S.pay.hrs[id];return v===undefined?H:Math.min(H,Math.max(0,v));};
function payCalc(){
  const P=S.pay,court=parseFloat(P.court),H=parseFloat(P.hours),shuttle=0;
  if(!(court>0)||!(H>0))return {err:'Enter the court fee and the booked hours.'};
  const feeOf=id=>{const v=parseFloat(S.guestFee);return v>0?v:0;};
  const att=S.players.filter(p=>!P.out[p.id]).map(p=>({id:p.id,name:p.name,guest:!!(P.guest&&P.guest[p.id]),h:payH(p.id,H),share:0})).filter(a=>a.h>0);
  if(!att.length)return {err:'Mark at least one player as played.'};
  const Hm=Math.max(...att.map(a=>a.h)),rate=court/Hm;
  const ts=[...new Set(att.map(a=>a.h))].sort((a,b)=>a-b);let prev=0;
  ts.forEach(t=>{const m=att.filter(a=>a.h>=t);const seg=rate*(t-prev)/m.length;m.forEach(a=>{a.share+=seg;});prev=t;});
  const regs=att.filter(a=>!a.guest),gs=att.filter(a=>a.guest);
  const useG=regs.length>0&&gs.length>0;
  const credit=useG?gs.reduce((q,a)=>q+feeOf(a.id),0):0;
  const pool=regs.length?regs:att;
  const perReg=(shuttle-credit)/pool.length;
  att.forEach(a=>{a.shut=(useG&&a.guest)?feeOf(a.id):(regs.length&&a.guest?0:perReg);a.raw=Math.max(0,a.share+a.shut);});
  if(!useG)att.forEach(a=>{a.shut=shuttle/att.length;a.raw=a.share+a.shut;});
  if(P.round)att.forEach(a=>{a.total=Math.ceil(a.raw*2-1e-7)/2;});
  else{
    att.forEach(a=>{a.c=Math.floor(a.raw*100+1e-7);a.f=a.raw*100-a.c;});
    let left=Math.round((court+shuttle)*100)-att.reduce((q,a)=>q+a.c,0);
    [...att].sort((x,y)=>y.f-x.f).forEach(a=>{if(left>0){a.c++;left--;}});
    att.forEach(a=>{a.total=a.c/100;});
  }
  const sum=att.reduce((s,a)=>s+a.total,0);
  return {rows:att,court,shuttle,H,Hm,sum,spent:court+shuttle,rd:P.round,useG,credit};
}
function payErr(c){return c.err||'';}
const hrTxt=h=>(Math.round(h*100)/100)+' h';
function payText(){
  const c=payCalc();if(c.err)return '';const P=S.pay;
  const d=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  return `\u{1F3F8} Badminton payments, ${d}\nCourt ${fmtM(c.court,false)} (${hrTxt(c.H)})`+(c.shuttle?` + shuttles ${fmtM(c.shuttle,false)}`:'')+`\n\n`+
    c.rows.map(r=>`${r.name}${r.guest?' (guest)':''}: ${fmtM(r.total,c.rd)} (${hrTxt(r.h)})${P.paid[r.id]?' ✅ paid':' ❌ not paid'}`).join('\n')+
    (c.useG?`\n\nGuest extra amounts are included and lower the others' share.`:'')+'';
}
function payInner(){
  const P=S.pay,c=payCalc(),lock=P.final;
  const H=parseFloat(P.hours);
  const rowOf=(p,isG)=>{
    const out=!!P.out[p.id],h=H>0?payH(p.id,H):0;
    const isGuest=!!(P.guest&&P.guest[p.id]);
    return `<div class="payitem"><div class="payrow${out?' off':''}"><span class="who"><button type="button" class="chip payin${out?'':' sel'}" data-act="payin" data-id="${p.id}" aria-pressed="${!out}" ${lock?'aria-disabled="true"':''}>${esc(p.name)}</button>${out?'':`<button type="button" class="chip gst${isGuest?' sel':''}" data-act="payguest" data-id="${p.id}" aria-pressed="${isGuest}" ${lock?'aria-disabled="true"':''}>Guest</button>`}</span>
      ${out?'<span class="muted">Absent</span>':`<span class="stepper"><button type="button" class="btn small icon" data-act="payhm" data-id="${p.id}" aria-label="Less time for ${esc(p.name)}" ${lock?'aria-disabled="true"':''}>−</button><b>${H>0?hrTxt(h):'-'}</b><button type="button" class="btn small icon" data-act="payhp" data-id="${p.id}" aria-label="More time for ${esc(p.name)}" ${lock?'aria-disabled="true"':''}>+</button></span>`}</div></div>`;
  };
  const pl=S.players.map(p=>rowOf(p,false)).join('');
  const err=payErr(c);let res;
  if(c.err){res=`<p class="hint">${esc(c.err)}</p>`;}
  else{
    res=`<div class="ptab"><div class="payh"><span class="n">Name</span><span>Hours</span><span>Amount</span></div>`+
      c.rows.map(r=>`<div class="payr"><span class="n">${lock?(P.paid[r.id]?'<span class="pk ok">\u2713</span> ':'<span class="pk no">\u2717</span> '):''}${esc(r.name)}${r.guest?'<small>Guest</small>':''}</span><span>${hrTxt(r.h)}</span><span><b>${fmtM(r.total,c.rd)}</b></span></div>`).join('')+`</div>
      <p class="hint">Total to collect: <b>${fmtM(c.sum,c.rd)}</b>. Bill: ${fmtM(c.spent,false)}${c.useG?`. Guest extra amounts (${fmtM(c.credit,false)}) reduce the others' share`:''}${c.Hm<c.H?` (court split over the ${hrTxt(c.Hm)} actually played)`:''}.</p>`+
      (lock?`<div class="paidlist"><h3>Who has paid?</h3><p class="hint" style="margin:0 0 6px">When someone pays, tap <b>Mark as paid</b> next to their name. Tap <b>Paid</b> again to undo.</p>${c.rows.map(r=>`<div class="prow"><span class="pn">${esc(r.name)}<small>${fmtM(r.total,c.rd)}</small></span><button type="button" class="pst ${P.paid[r.id]?'yes':'no'}" data-act="paytick" data-id="${r.id}" aria-pressed="${!!P.paid[r.id]}">${P.paid[r.id]?'\u2713 Paid':'Mark as paid'}</button></div>`).join('')}</div>`:'');
  }
  let acts;
  if(!lock)acts=`<p class="hint" style="margin:0">Draft. Check the amounts, then confirm to finalise.</p><button class="btn primary block" type="button" data-act="payfinal" ${err?'disabled':''}>Review and confirm</button>${err&&!c.err?`<p class="hint" style="margin:0">${esc(err)}</p>`:''}`;
  else{const t=payText();acts=`<div class="okbox" role="status"><b>Confirmed.</b> These amounts are final.</div><pre class="share" id="payTxt">${esc(t)}</pre>
    <button class="btn primary block" type="button" data-act="sharepayimg">Share as image</button>
    <button class="btn block" type="button" data-act="paycopy">Copy text</button>
    <a class="btn block" href="https://wa.me/?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">Share text on WhatsApp</a>
    <p class="hint" id="payMsg" role="status" style="margin:0;text-align:center"></p>
    <button class="linkbtn" type="button" data-act="payedit">Edit amounts again</button>`;}
  return {pl,res:`<h2>${lock?'Final payments':'Payments'}</h2>${res}<div class="btns">${acts}</div>`};
}
function viewPay(){
  const P=S.pay,lock=P.final,inner=payInner();
  const fld=(id,lab,val,ph)=>`<label class="lbl">${lab}<input id="${id}" class="field" type="number" inputmode="decimal" min="0" step="any" value="${esc(val)}" placeholder="${ph}" ${lock?'disabled':''}></label>`;
  return `<div class="stack">
    <section class="card"><h2>Bill</h2>
      <div class="payfields">${fld('payCourt','Court fee',P.court,'0')}${fld('payHours','Hours',P.hours,'0')}
      ${fld('payGuestFee','Guest extra',S.guestFee,'2')}</div>
      <p class="hint" style="margin:8px 0 0">All amounts are in AED. Guest extra is what each guest pays on top; it lowers everyone else's share.</p>
      <button class="ptsrow" type="button" data-act="payround" role="switch" aria-checked="${P.round}" ${lock?'aria-disabled="true"':''}><span>Round up to 0.50 AED<small>Easier to pay: 17.15 becomes 17.50, 17.60 becomes 18.00. The total may be slightly more than the bill.</small></span><span class="pill${P.round?' on':''}">${P.round?'ON':'OFF'}</span></button>
    </section>
    <section class="card"><h2>Who played, and for how long</h2>
      <p class="hint" style="margin-top:0">Tap a name to mark absent. Use + and − if someone played less (1 hour at a time). Switch Guest on for an occasional visitor: they pay the Guest extra amount on top of their share, and it lowers everyone else's share.</p>
      <div id="payPl">${inner.pl}</div></section>
    <section class="card" id="payRes">${inner.res}</section>
  </div>`;
}
function refreshPay(onlyRes){const i=payInner();const a=$('#payPl'),b=$('#payRes');if(a&&!onlyRes)a.innerHTML=i.pl;if(b)b.innerHTML=i.res;save();}
function payCanvas(){
  const c0=payCalc(),P=S.pay;
  const W=1080,Pd=48,IW=W-2*Pd,HEAD=250,TH=70,RH=84,rows=c0.rows;
  const c=document.createElement('canvas');const ctx=c.getContext('2d');
  const BODY="'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif",DISP="'Barlow Condensed','Arial Narrow',sans-serif";
  const H=HEAD+30+TH+rows.length*RH+170;c.width=W;c.height=H;
  ctx.fillStyle='#eef3ee';ctx.fillRect(0,0,W,H);ctx.fillStyle='#1c6b4f';ctx.fillRect(0,0,W,HEAD);ctx.textBaseline='alphabetic';
  ctx.fillStyle='#dff3e7';ctx.font=`600 28px ${BODY}`;ctx.fillText('BADMINTON · DOUBLES',Pd,82);
  ctx.fillStyle='#ffffff';ctx.font=`700 96px ${DISP}`;ctx.fillText('PAYMENTS',Pd,170);
  ctx.fillStyle='#dff3e7';ctx.font=`500 32px ${BODY}`;ctx.fillText(fullDate(),Pd,222);
  let y=HEAD+30;ctx.fillStyle='#1c6b4f';ctx.fillRect(Pd,y,IW,TH);
  ctx.fillStyle='#ffffff';ctx.font=`700 30px ${BODY}`;ctx.textAlign='left';ctx.fillText('NAME',Pd+22,y+46);
  ctx.textAlign='center';ctx.fillText('HOURS',W-Pd-330,y+46);ctx.textAlign='right';ctx.fillText('AMOUNT',W-Pd-22,y+46);y+=TH;
  rows.forEach((r,i)=>{
    ctx.fillStyle=i%2?'#f7faf7':'#ffffff';ctx.fillRect(Pd,y,IW,RH);
    ctx.strokeStyle='#d6e0d8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Pd,y+RH);ctx.lineTo(Pd+IW,y+RH);ctx.stroke();
    ctx.textAlign='left';ctx.fillStyle='#13201a';ctx.font=`700 44px ${DISP}`;
    let n=r.name+(r.guest?' (guest)':'');const mw=W-Pd-330-110-(Pd+22);
    while(ctx.measureText(n).width>mw&&n.length>3)n=n.slice(0,-1);
    ctx.fillText(n,Pd+22,y+56);
    { const nw=ctx.measureText(n).width;ctx.fillStyle=P.paid[r.id]?'#1c6b4f':'#c0392b';ctx.font=`700 44px ${DISP}`;ctx.fillText(P.paid[r.id]?'\u2713':'\u2717',Pd+22+nw+14,y+56); }
    ctx.textAlign='center';ctx.fillStyle='#587064';ctx.font=`600 36px ${DISP}`;ctx.fillText(hrTxt(r.h),W-Pd-330,y+56);
    ctx.textAlign='right';ctx.fillStyle='#1c6b4f';ctx.font=`700 46px ${DISP}`;ctx.fillText(fmtM(r.total,c0.rd),W-Pd-22,y+58);
    y+=RH;
  });
  ctx.textAlign='left';ctx.fillStyle='#13201a';ctx.font=`700 40px ${DISP}`;ctx.fillText(`Total: ${fmtM(c0.sum,c0.rd)}`,Pd,y+56);
  ctx.fillStyle='#587064';ctx.font=`500 26px ${BODY}`;
  ctx.fillText(`Court ${fmtM(c0.court,false)}`+(c0.shuttle?` · shuttles ${fmtM(c0.shuttle,false)}`:'')+(c0.useG?` · guest extra amounts included`:''),Pd,y+100);
  ctx.fillText('Shuttle Turns',Pd,H-40);
  return c;
}

const KEY3='shuttle-turns-v3';
const sesName=ts=>new Date(ts).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function setOpen(v){try{v?sessionStorage.setItem('st-open','1'):sessionStorage.removeItem('st-open');}catch(e){}}
function loadStore(){
  try{const raw=localStorage.getItem(KEY3);if(raw){const st=JSON.parse(raw);if(st&&Array.isArray(st.sessions)){st.sessions=st.sessions.map(x=>({...x,data:normalize(x.data)})).filter(x=>x.data);if(!st.nextSid)st.nextSid=st.sessions.reduce((m,x)=>Math.max(m,x.id),0)+1;if(!st.sessions.some(x=>x.id===st.cur))st.cur=null;return st;}}}catch(e){}
  const st={sessions:[],cur:null,nextSid:1};const old=load();
  if(old&&(old.games.length||old.tour||!old.sample)){const ts=old.endedAt||Date.now();st.sessions.push({id:1,name:sesName(ts),created:ts,data:old});st.nextSid=2;}
  return st;
}
let store=loadStore();
let home=false;
try{home=store.sessions.length>0&&!sessionStorage.getItem('st-open');}catch(e){home=store.sessions.length>0;}
if(!store.sessions.length){store.sessions.push({id:1,name:sesName(Date.now()),created:Date.now(),data:fresh()});store.cur=1;store.nextSid=2;home=false;setOpen(true);}
let S=(store.sessions.find(x=>x.id===store.cur)||store.sessions[store.sessions.length-1]).data;
function save(){try{localStorage.setItem(KEY3,JSON.stringify(store));}catch(e){}}
let sesForm=false,sesTarget=0;
function uniqueName(base){let n=base,k=2;while(store.sessions.some(x=>x.name===n))n=base+' ('+(k++)+')';return n;}
function newSessionData(src){
  const d=fresh();d.sample=false;
  if(!src){d.players=[];d.nextId=1;return d;}
  const m={};d.players=src.players.map((q,i)=>{m[q.id]=i+1;return {id:i+1,name:q.name,active:true,base:0};});d.nextId=d.players.length+1;
  d.teams=src.teams.map(t=>({...t,members:t.members.map(id=>m[id]).filter(Boolean),base:0})).filter(t=>t.members.length===2);d.nextTid=src.nextTid||1;
  d.mode=src.mode;d.pts=!!src.pts;d.shuffle=true;d.guestFee=src.guestFee||'2';
  return d;
}
function sesInfo(x){
  const d=x.data;let n=0,st='Not started';
  if(d.mode==='tour'&&d.tour){n=d.tour.matches.filter(m=>m.w!=null).length;st=d.tour.matches.length&&d.tour.matches.every(m=>m.w!=null)?'Finished':'In progress';}
  else if(d.games.length){n=d.cur+1;st=d.ended?'Ended':'In progress';}
  return `${d.players.length} players \u00B7 ${n} ${d.mode==='tour'?(n===1?'match':'matches'):(n===1?'game':'games')} \u00B7 ${st}`;
}
function pendingPay(x){
  const d=x.data;if(!d.pay||!d.pay.final)return 0;
  const o=S;S=d;try{const c=payCalc();return c.rows?c.rows.filter(r=>!d.pay.paid[r.id]).length:0;}catch(e){return 0;}finally{S=o;}
}
let monSel='',backupMsg='',pendRestore=null;
const monKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const monLabel=k=>new Date(+k.slice(0,4),+k.slice(5)-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
function monthKeys(){const m=new Set();store.sessions.forEach(x=>{if(x.data.mode!=='tour'&&x.data.games.some(g=>gameWinOf(g)!=null))m.add(monKey(x.created));});return [...m].sort().reverse();}
const gameWinOf=g=>(g.sa!=null&&g.sb!=null&&g.sa!==g.sb)?(g.sa>g.sb?0:1):(g.win===0||g.win===1?g.win:null);
function monthRows(key){
  const m=new Map();let days=0,games=0;
  store.sessions.forEach(x=>{
    const d=x.data;if(d.mode==='tour'||monKey(x.created)!==key)return;
    let any=false;
    d.games.forEach(g=>{
      const w=gameWinOf(g);if(w==null||!g.teams)return;any=true;games++;
      [0,1].forEach(k=>g.teams[k].forEach(id=>{
        const q=d.players.find(z=>z.id===id);if(!q)return;
        const nk=q.name.trim().toLowerCase();
        if(!m.has(nk))m.set(nk,{name:q.name.trim(),p:0,w:0,l:0});
        const r=m.get(nk);r.p++;if(w===k)r.w++;else r.l++;
      }));
    });
    if(any)days++;
  });
  const rows=[...m.values()].sort((a,b)=>b.w-a.w||(b.w/b.p)-(a.w/a.p)||b.p-a.p||a.name.localeCompare(b.name));
  return {rows,days,games};
}
function monText(key,r){
  return `\u{1F3F8} Badminton, ${monLabel(key)}\nGames: ${r.games} in ${r.days} ${r.days===1?'day':'days'}\n\nWin / loss table\n`+r.rows.map((x,i)=>`${i+1}. ${x.name}: played ${x.p}, won ${x.w}, lost ${x.l}`).join('\n');
}
function monthCard(){
  const keys=monthKeys();
  if(!keys.length)return `<section class="card"><h2>Monthly table</h2><p class="hint" style="margin:0">After you mark who won in some games, a win / loss table for the whole month appears here.</p></section>`;
  const key=keys.includes(monSel)?monSel:keys[0];
  const r=monthRows(key);const text=monText(key,r);
  return `<section class="card"><h2>Monthly table</h2>
    <label class="lbl">Month<select id="monSel" class="field">${keys.map(k=>`<option value="${k}" ${k===key?'selected':''}>${esc(monLabel(k))}</option>`).join('')}</select></label>

  S.players.forEach(p=>{c[p.id]=p.base||0;last[p.id]=-1;});
  S.games.slice(0,upto===undefined?S.games.length:upto).forEach((g,i)=>{
    g.teams.flat().forEach(id=>{c[id]=(c[id]||0)+1;last[id]=i;});
    const [t1,t2]=g.teams;
    inc(partner,key(t1[0],t1[1]));inc(partner,key(t2[0],t2[1]));
    t1.forEach(a=>t2.forEach(b=>inc(opp,key(a,b))));

  });

  const options=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];
  const score=o=>{
    let s=(t.partner[key(o[0][0],o[0][1])]||0)*10+(t.partner[key(o[1][0],o[1][1])]||0)*10;
    o[0].forEach(x=>o[1].forEach(y=>{s+=(t.opp[key(x,y)]||0);}));
    return s+(shuf?rnd()*0.9:0);
  };
  let best=options[0],bs=Infinity;
  options.forEach(o=>{const sc=score(o);if(sc<bs){bs=sc;best=o;}});
  return {teams:best,bench};
}

/* ---- rotation logic: fixed teams ---- */
function tallyT(upto){
  const c={},last={},meet={};
  S.teams.forEach(t=>{c[t.id]=t.base||0;last[t.id]=-1;});
  S.games.slice(0,upto===undefined?S.games.length:upto).forEach((g,i)=>{
    if(!g.tm)return;
    g.tm.forEach(tid=>{c[tid]=(c[tid]||0)+1;last[tid]=i;});
    inc(meet,key(g.tm[0],g.tm[1]));
  });
  return {c,last,meet};
}
function minTeamCount(t){
  const a=S.teams.filter(teamActive).map(x=>t.c[x.id]);
  return a.length?Math.min(...a):0;
}
function pickNextTeams(){
  const t=tallyT();
  const act=S.teams.filter(teamActive);
  if(act.length<2) return null;
  const order=new Map(S.teams.map((x,i)=>[x.id,i]));
  const sorted=[...act].sort((a,b)=>t.c[a.id]-t.c[b.id]||t.last[a.id]-t.last[b.id]||order.get(a.id)-order.get(b.id));
  const first=sorted[0];
  const lim=t.c[sorted[1].id];
  const cands=sorted.slice(1).filter(x=>t.c[x.id]===lim);
  let opp=cands[0];
  cands.forEach(x=>{if((t.meet[key(first.id,x.id)]||0)<(t.meet[key(first.id,opp.id)]||0))opp=x;});
  const tm=[first.id,opp.id];
  const benchT=sorted.filter(x=>x.id!==first.id&&x.id!==opp.id).map(x=>x.id);
  return {mode:'teams',tm,teams:[tmembers(tm[0]).slice(),tmembers(tm[1]).slice()],benchT,bench:benchT.flatMap(tmembers)};
}
const pickGame=()=>S.mode==='teams'?pickNextTeams():pickNext();

/* ---- summary ---- */
function ptsRows(){
  const isT=S.mode==='teams';
  const m=new Map();
  const ent=(id,name,sub)=>{if(!m.has(id))m.set(id,{name,sub,p:0,w:0,l:0,pf:0,pa:0});return m.get(id);};
  if(isT)S.teams.forEach(t=>ent(t.id,tname(t.id),rawPair(t.members)));else S.players.forEach(p=>ent(p.id,p.name,''));
  S.games.forEach(g=>{
    const w=gameWin(g);if(w==null)return;
    const sc=g.sa!=null&&g.sb!=null;
    const sides=[{ids:isT?[g.tm[0]]:g.teams[0],f:sc?g.sa:0,a:sc?g.sb:0,won:w===0},{ids:isT?[g.tm[1]]:g.teams[1],f:sc?g.sb:0,a:sc?g.sa:0,won:w===1}];
    sides.forEach(sd=>sd.ids.forEach(id=>{
      const r=m.get(id)||ent(id,isT?tname(id):nm(id),'');
      r.p++;r.pf+=sd.f;r.pa+=sd.a;if(sd.won)r.w++;else r.l++;
    }));
  });
  const order=[...m.keys()];
  return [...m.entries()].map(([id,r])=>({...r,id,d:r.pf-r.pa})).filter(r=>r.p>0).sort((x,y)=>y.w-x.w||y.d-x.d||y.pf-x.pf||order.indexOf(x.id)-order.indexOf(y.id));
}
const gameWin=g=>(g.sa!=null&&g.sb!=null&&g.sa!==g.sb)?(g.sa>g.sb?0:1):(g.win===0||g.win===1?g.win:null);

/* ---- tournament ---- */
const fullDate=()=>new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const tdesc=id=>`${tname(id)} (${rawPair(tmembers(id))})`;
const roundName=m=>({rr:'Round robin',sf:'Semi-final',f:'Final','3rd':'Third place'}[m.round]);
const resultLine=m=>{
  const l=m.w===m.a?m.b:m.a;
  return `${tname(m.w)} beat ${tname(l)}`+(m.sa!=null?` ${m.w===m.a?m.sa:m.sb}-${m.w===m.a?m.sb:m.sa}`:'');
};
function rrSchedule(ids){
  const t=ids.slice();if(t.length%2)t.push(null);
  const n=t.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!=null&&b!=null)out.push([a,b]);}
    t.splice(1,0,t.pop());
  }
  return out;
}
function standings(){
  const T=S.tour;
  const rows=T.ids.map(id=>({id,p:0,w:0,l:0,pf:0,pa:0}));
  const row=id=>rows.find(r=>r.id===id);
  T.matches.filter(m=>m.round==='rr'&&m.w!=null).forEach(m=>{
    const a=row(m.a),b=row(m.b);a.p++;b.p++;
    if(m.w===m.a){a.w++;b.l++;}else{b.w++;a.l++;}
    if(m.sa!=null&&m.sb!=null){a.pf+=m.sa;a.pa+=m.sb;b.pf+=m.sb;b.pa+=m.sa;}
  });
  rows.forEach(r=>{r.d=r.pf-r.pa;});
  const idx=id=>T.ids.indexOf(id);
  return rows.sort((x,y)=>y.w-x.w||y.d-x.d||y.pf-x.pf||idx(x.id)-idx(y.id));
}
function tourInfo(){
  const T=S.tour,ms=T.matches,n=T.ids.length;
  const rr=ms.filter(m=>m.round==='rr'),ko=ms.filter(m=>m.round!=='rr');
  const rrDone=rr.every(m=>m.w!=null);
  const cur=ms.find(m=>m.w==null)||null;
  const done=rrDone&&(n===2||(ko.some(m=>m.round==='f')&&ko.every(m=>m.w!=null)));
  return {n,rr,ko,rrDone,cur,st:standings(),done,needKo:rrDone&&n>=3&&ko.length===0};
}
function tourResults(){
  const I=tourInfo(),T=S.tour;if(!I.done)return null;
  if(I.n===2){const m=I.rr[0];return {champ:m.w,runner:m.w===m.a?m.b:m.a,third:null};}
  const f=T.matches.find(m=>m.round==='f'),tp=T.matches.find(m=>m.round==='3rd');
  return {champ:f.w,runner:f.w===f.a?f.b:f.a,third:tp?tp.w:(I.n===3?I.st[2].id:null)};
}
function startTour(){
  const ids=S.teams.map(t=>t.id);if(ids.length<2)return;
  const ms=rrSchedule(ids).map((pr,i)=>({id:i+1,a:pr[0],b:pr[1],round:'rr',w:null,sa:null,sb:null,t:null}));
  S.tour={ids,matches:ms,nextId:ms.length+1};
  S.tab='play';
}
function tourText(){
  const I=tourInfo(),T=S.tour,R=tourResults();
  let t=`\u{1F3F8} Badminton tournament, ${fullDate()}\n`;
  if(R)t+=`\nChampions: ${tdesc(R.champ)}\nRunner-up: ${tdesc(R.runner)}\n`+(R.third?`Third: ${tdesc(R.third)}\n`:'');
  t+='\nTable\n'+I.st.map((r,i)=>`${i+1}. ${tdesc(r.id)}: ${r.w}W ${r.l}L`+((r.pf||r.pa)?` (${r.d>0?'+':''}${r.d})`:'')).join('\n');
  const played=T.matches.filter(m=>m.w!=null);
  if(played.length)t+='\n\nResults\n'+played.map(m=>`${roundName(m)}: ${resultLine(m)}`).join('\n');
  return t;
}
const shareText=()=>S.mode==='tour'&&S.tour?tourText():summaryText();
function tourSpec(){
  const I=tourInfo(),T=S.tour,R=tourResults();
  const blocks=[];
  if(R)blocks.push({n:'CHAMPIONS',who:tdesc(R.champ),rest:['Runner-up: '+tdesc(R.runner)].concat(R.third?['Third: '+tdesc(R.third)]:[])});
  blocks.push({n:'TABLE',who:I.st.map((r,i)=>`${i+1}. ${tname(r.id)}  ${r.w}-${r.l}`+((r.pf||r.pa)?`  (${r.d>0?'+':''}${r.d})`:'')),rest:I.st.map(r=>`${tname(r.id)}: ${rawPair(tmembers(r.id))}`)});
  const played=T.matches.filter(m=>m.w!=null);
  if(played.length)blocks.push({n:'RESULTS',who:played.map(m=>`${roundName(m)}: ${resultLine(m)}`),rest:[]});

function viewPlay(){

    return `<div class="card empty"><h2 style="margin:0">No game yet</h2><p class="muted">Set up players${S.mode==='teams'?' and teams':''} on the Players tab, then start the session. Games appear here one at a time.</p><button class="btn primary" type="button" data-tab="players">Go to players</button></div>`;

  }
  fixCurrent();
  const n=S.cur+1;
  const cur=S.games[S.cur];
  const planned=S.games.slice(S.cur+1);

    restNow=(cur.benchT&&cur.benchT.length)?(S.ended?tchips(cur.benchT):cur.benchT.map(id=>`<button type="button" class="chip pickc${selT(id)?' sel':''}" data-act="pickt" data-id="${id}" aria-pressed="${selT(id)}">${esc(tname(id))} · ${tpair(id)}</button>`).join('')):'<span class="muted">Nobody. All active teams are on court.</span>';

    if(!S.ended){const onN=new Set(cur.teams.flat());cur.bench=S.players.filter(p=>p.active&&!onN.has(p.id)).map(p=>p.id);}

  return `<div class="stack">

      <div class="btns" style="margin-top:0">

      </div>

    <button class="btn primary block" type="button" data-act="nextgame" ${nxt?'':'disabled'}>Next game</button>
    <button class="btn block" type="button" data-tab="history">View ${S.pts?'points':'win / loss'} table${scoredGames()?'':(S.pts?' (no scores yet)':' (no results yet)')}</button>
    ${nextCard}
    ${laterCard}
    ${switchCard}
    <button class="btn block" type="button" data-act="end">End games for today</button>
    ${n>1?`<button class="linkbtn" type="button" data-act="prev">Previous game</button>`:''}
  </div>`;
}
function viewHistory(){
  if(S.mode==='tour')return viewTourHistory();
  if(!S.games.length){
    return `<div class="card empty"><h2 style="margin:0">No games yet</h2><p class="muted">Every game, and who played in it, will be listed here once the session starts.</p></div>`;
  }
  const isT=S.mode==='teams';
  const cur=S.games[S.cur];
  const frow=(label,sub,c,max,st)=>`<div class="frow"><span class="n">${esc(label)}${sub?`<small>${esc(sub)}</small>`:''}</span><span class="bar"><i style="width:${Math.round(c/max*100)}%"></i></span>${st}<span class="c">${c}</span></div>`;
  const stOn='<span class="pill">On court</span>',stRest='<span class="pill rest-pill">Resting</span>',stLeft='<span class="pill left">Left</span>';
  let rows,spread;
  if(isT){
    const t=tallyT(S.cur+1);
    const onC=new Set(cur.tm||[]);
    const max=Math.max(1,...S.teams.map(x=>t.c[x.id]));
    const act=S.teams.filter(teamActive).map(x=>t.c[x.id]);
    spread=act.length?Math.max(...act)-Math.min(...act):0;
    rows=S.teams.map(x=>frow(tname(x.id),rawPair(x.members),t.c[x.id],max,!teamActive(x)?stLeft:onC.has(x.id)?stOn:stRest)).join('');
  }else{
    const t=tally(S.cur+1);
    const onC=new Set(cur.teams.flat());
    const max=Math.max(1,...S.players.map(p=>t.c[p.id]));
    const act=S.players.filter(p=>p.active).map(p=>t.c[p.id]);
    spread=act.length?Math.max(...act)-Math.min(...act):0;
    rows=S.players.map(p=>frow(p.name,'',t.c[p.id],max,!p.active?stLeft:onC.has(p.id)?stOn:stRest)).join('');
  }
  const unit=isT?'team':'player';
  const summary=spread<=1
    ?`<span class="pill">Even</span><span class="muted">Every ${unit} is within 1 turn of each other.</span>`
    :`<span class="pill rest-pill">Gap of ${spread}</span><span class="muted">Whoever rested will play next.</span>`;
  const log=S.games.map((g,i)=>`<li><span><b>Game ${i+1}</b> \u00B7 ${esc(gameWho(g))}${g.sa!=null?` <b>${g.sa}-${g.sb}</b>`:''}${!S.ended&&i===S.cur?' <span class="pill">On court</span>':''}${i>S.cur?' <span class="pill rest-pill">Planned</span>':''}</span><small>${esc(gameRest(g))}</small></li>`).join('');
  return `<div class="stack">
    ${S.ended?summaryCard():(hasRes()?ptsCard():'')}
    <section class="card">
      <h2>Game log</h2>
      <ul class="log">${log}</ul>
      <div class="btns">
        <button class="btn primary block" type="button" data-act="shareimg">Share game log as image</button>
        <p class="hint" id="shareMsg" role="status" style="margin:0;text-align:center">${esc(shareMsg)}</p>
      </div>
    </section>
    ${S.ended?'':`<section class="card">
      <h2>Turns per ${unit}</h2>
      <div class="summary">${summary}</div>
      ${rows}
      <p class="hint">Counts include the game on court. Late arrivals start level with the lowest count.</p>
    </section>`}
  </div>`;
}

/* ---- actions ---- */
function addPlayer(name){
  dropPlanned();
  const t=tally(S.cur+1);
  const base=S.games.length?minActiveCount(t):0;
  S.players.push({id:S.nextId++,name,active:true,base});
  S.sample=false;
}
function addTeam(a,b){
  dropPlanned();
  const base=S.games.length?minTeamCount(tallyT(S.cur+1)):0;
  S.teams.push({id:S.nextTid++,members:[a,b],base});
  S.sample=false;
}
function autopair(){
  const assigned=new Set(S.teams.flatMap(x=>x.members));
  const free=S.players.filter(p=>p.active&&!assigned.has(p.id));
  for(let i=0;i+1<free.length;i+=2)addTeam(free[i].id,free[i+1].id);
}
const actions={
  start(){scDraft={k:-1,a:'',b:''};swapSel={i:-1,id:0};if(S.mode==='tour'){startTour();return;}const g=pickGame();if(!g)return;S.games=[{...g,at:Date.now()}];S.cur=0;S.tab='play';},
  nextgame(){
    if(S.ended)return;

      const g0=S.games[S.cur];
      if(S.cur+1<S.games.length&&g0.sa!=null&&(g0.sa!==r.a||g0.sb!==r.b)){pendScore={i:S.cur,a:r.a,b:r.b};dialog='scoreedit';return;}
      g0.sa=r.a;g0.sb=r.b;scDraft={k:-1,a:'',b:''};}
    if(S.cur+1<S.games.length){S.cur++;}
    else{const g=pickGame();if(!g)return;S.games.push({...g,at:Date.now()});S.cur=S.games.length-1;}
    S.games[S.cur].at=Date.now();
  },
  confirmscoreedit(){
    dialog=null;const g=pendScore&&S.games[pendScore.i];
    if(g){g.sa=pendScore.a;g.sb=pendScore.b;}
    pendScore=null;scDraft={k:-1,a:'',b:''};
    if(S.cur+1<S.games.length)S.cur++;S.games[S.cur].at=Date.now();
  },
  prev(){if(S.cur>0)S.cur--;},
  pickp(id){
    const g=S.games[S.cur];if(!g||S.ended||g.mode==='teams')return false;
    if(swapSel.i!==S.cur||!swapSel.id){swapSel={i:S.cur,id};return;}
    if(swapSel.id===id){swapSel={i:-1,id:0};return;}
    const a=swapSel.id,b=id;
    const onC=x=>g.teams.some(t=>t.includes(x));
    if(!onC(a)&&!onC(b)){swapSel={i:S.cur,id:b};return;}
    swapSel={i:-1,id:0};
    if(S.cur+1<S.games.length){pendSwap={i:S.cur,a,b,t:'p'};dialog='swapedit';return;}
    doSwapP(g,a,b);
  },
  pickt(id){
    const g=S.games[S.cur];if(!g||S.ended||g.mode!=='teams')return false;
    if(swapSel.i!==S.cur||!swapSel.id){swapSel={i:S.cur,id};return;}
    if(swapSel.id===id){swapSel={i:-1,id:0};return;}
    const a=swapSel.id,b=id,onC=x=>g.tm.includes(x);
    if(onC(a)===onC(b)){swapSel={i:S.cur,id:b};return;}
    swapSel={i:-1,id:0};

  shareimg(){shareImage();},

  suggest(){S.teamMode=!S.teamMode;},
  setwin(k){const g=S.games[S.cur];if(!g||S.ended||S.pts)return false;g.win=(g.win===k)?null:k;},

  startko(){

    const ids=I.st.map(r=>r.id),T=S.tour;
    const add=(a,b,round)=>T.matches.push({id:T.nextId++,a,b,round,w:null,sa:null,sb:null,t:null});
    if(I.n>=4){add(ids[0],ids[3],'sf');add(ids[1],ids[2],'sf');}else add(ids[0],ids[1],'f');
  },
  win(tid){
    if(!S.tour)return false;
    const I=tourInfo(),m=I.cur,T=S.tour;
    if(!m||(tid!==m.a&&tid!==m.b))return false;
    const msg=t=>{const el=$('#tourMsg');if(el)el.textContent=t;};
    const ea=$('#sa'),eb=$('#sb');
    const va=ea?String(ea.value).trim():'',vb=eb?String(eb.value).trim():'';
    let sa=null,sb=null;
    if(S.pts&&(va===''||vb==='')){msg('Enter the score of both teams first.');return false;}
    if(va!==''||vb!==''){
      const na=Number(va),nb=Number(vb);
      if(va===''||vb===''||!Number.isInteger(na)||!Number.isInteger(nb)||na<0||nb<0){msg('Enter both scores as whole numbers, or leave both empty.');return false;}
      const mine=tid===m.a?na:nb,theirs=tid===m.a?nb:na;
      if(mine<=theirs){msg('The winner needs the higher score.');return false;}
      sa=na;sb=nb;
    }
    T.seq=(T.seq||0)+1;m.w=tid;m.sa=sa;m.sb=sb;m.t=T.seq;
    const sfs=T.matches.filter(x=>x.round==='sf');
    if(sfs.length===2&&sfs.every(x=>x.w!=null)&&!T.matches.some(x=>x.round==='f')){
      const lose=x=>x.w===x.a?x.b:x.a;
      T.matches.push({id:T.nextId++,a:lose(sfs[0]),b:lose(sfs[1]),round:'3rd',w:null,sa:null,sb:null,t:null});
      T.matches.push({id:T.nextId++,a:sfs[0].w,b:sfs[1].w,round:'f',w:null,sa:null,sb:null,t:null});
    }
  },
  undoresult(){
    if(!S.tour)return;
    const T=S.tour;
    const m=T.matches.filter(x=>x.w!=null).sort((x,y)=>y.t-x.t)[0];if(!m)return;
    m.w=null;m.sa=null;m.sb=null;m.t=null;
    if(m.round==='rr')T.matches=T.matches.filter(x=>x.round==='rr');
    if(m.round==='sf')T.matches=T.matches.filter(x=>!((x.round==='f'||x.round==='3rd')&&x.w==null));
  },
  autopair(){autopair();},

  },
  reset(){dialog='reset';},
  menutoggle(){const m=$('#menu');if(m.hidden)renderMenu();m.hidden=!m.hidden;$('#menuBtn').setAttribute('aria-expanded',String(!m.hidden));return false;},
  ...Object.fromEntries(['system','light','dark'].map(k=>['theme'+k,()=>{P.theme=k;savePrefs();applyPrefs();renderMenu();return false;}])),
  bigtext(){P.big=!P.big;savePrefs();applyPrefs();renderMenu();return false;},
  awake(){P.awake=!P.awake;savePrefs();wake();renderMenu();return false;},
  helpopen(){closeMenu();window.scrollTo(0,0);contactOpen=false;helpOpen=true;},
  helpclose(){helpOpen=false;},
  contactopen(){closeMenu();window.scrollTo(0,0);helpOpen=false;contactOpen=true;if(cst.s==='sent')cst={s:'idle',m:''};},
  contactclose(){contactOpen=false;},
  contactnew(){cst={s:'idle',m:''};},
  gotoreset(){hideToast();window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});return false;},
  confirmreset(){dialog=null;guestAdd=false;S.pay=payDefault();hideToast();scDraft={k:-1,a:'',b:''};swapSel={i:-1,id:0};S.tour=null;S.games=[];S.cur=0;S.ended=false;S.endedAt=null;copyMsg='';S.players.forEach(p=>{p.base=0;p.active=true;});S.teams.forEach(x=>{x.base=0;});S.tab='players';},
  cancel(){dialog=null;pendRestore=null;dropNote=false;pendSwap=null;if(pendScore){pendScore=null;scDraft={k:-1,a:'',b:''};}},
  rename(id){renameId=id;dialog='rename';}
};
document.addEventListener('click',e=>{
  if(!e.target.closest('#menu,#menuBtn'))closeMenu();
  const el=e.target.closest('[data-tab],[data-act]');if(!el)return;
  if(el.dataset.tab){hideToast();contactOpen=false;helpOpen=false;S.tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
  const f=actions[el.dataset.act];
  if(f){const r=f(el.dataset.id?+el.dataset.id:undefined);if(r!==false&&!['copy','shareimg','shareptsimg'].includes(el.dataset.act))render();if(r!==false&&['start','nextgame','prev','confirmend','confirmreset','win','startko'].includes(el.dataset.act))window.scrollTo(0,0);}
});
document.addEventListener('submit',e=>{
  if(!e.target)return;
  if(e.target.id==='guestForm'){
    e.preventDefault();
    const name=$('#guestName').value.trim();if(!name)return;
    const P=S.pay;if(!Array.isArray(P.guests))P.guests=[];
    P.gid=(P.gid||0)+1;P.guests.push({id:-P.gid,name});guestAdd=false;render();return;
  }
  if(e.target.id==='sesForm'){
    e.preventDefault();
    const nm0=$('#sesName').value.trim()||sesName(Date.now());
    const src=store.sessions.find(x=>x.id===+$('#sesSrc').value);
    const id=store.nextSid++;
    store.sessions.push({id,name:uniqueName(nm0),created:Date.now(),data:newSessionData(src?src.data:null)});
    S=store.sessions[store.sessions.length-1].data;store.cur=id;sesForm=false;home=false;setOpen(true);S.tab='players';
    scDraft={k:-1,a:'',b:''};swapSel={i:-1,id:0};render();window.scrollTo(0,0);return;
  }
  if(e.target.id==='sesRenForm'){
    e.preventDefault();
    const nm0=$('#sesRenIn').value.trim();if(!nm0){$('#sesRenMsg').textContent='Enter a name.';return;}
    if(store.sessions.some(x=>x.id!==sesTarget&&x.name===nm0)){$('#sesRenMsg').textContent='That name is already used.';return;}
    const x=store.sessions.find(q=>q.id===sesTarget);if(x)x.name=nm0;dialog=null;render();return;
  }
  if(e.target.id==='renameForm'){
    e.preventDefault();
    const name=$('#renameIn').value.trim();
    const msg=t=>{$('#renameMsg').textContent=t;};
    if(!name){msg('Enter a name.');return;}
    if(S.players.some(p=>p.id!==renameId&&p.name.toLowerCase()===name.toLowerCase())){msg('That name is already on the list.');return;}
    const p=S.players.find(x=>x.id===renameId);if(p)p.name=name;
    dialog=null;render();return;
  }
  if(e.target.id==='contactForm'){
    e.preventDefault();
    if($('#cHoney').value)return;
    cd={kind:$('#cKind').value,contact:$('#cContact').value.trim(),msg:$('#cMsg').value.trim()};
    const okC=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cd.contact)||cd.contact.replace(/\D/g,'').length>=6;
    if(!okC){cst={s:'error',m:'Enter a valid phone number or email.'};render();return;}
    if(cd.msg.length<5){cst={s:'error',m:'Please write your request.'};render();return;}
    sendContact();return;
  }
  if(e.target.id==='addForm'){
    e.preventDefault();
    const inp=$('#nameIn');const name=inp.value.trim();if(!name)return;
    if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){
      $('#addMsg').textContent='That name is already on the list.';return;
    }
    addPlayer(name);render();
    const again=$('#nameIn');if(again)again.focus();
  }else if(e.target.id==='teamForm'){
    e.preventDefault();
    const a=+$('#tp1').value,b=+$('#tp2').value;
    if(!a||!b||a===b){$('#teamMsg').textContent='Pick two different players.';return;}
    addTeam(a,b);render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t&&t.id==='monSel'){monSel=t.value;render();return;}
  if(t&&t.id==='restoreFile'&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{const r=readRestore(String(fr.result||''));if(r.err){backupMsg=r.err;render();return;}pendRestore=r;dialog='restore';render();};
    fr.onerror=()=>{backupMsg='Could not read the file.';render();};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog=null;render();}});
setInterval(()=>{
  const el=$('#elapsed');
  if(el&&S.games.length&&S.games[S.cur])el.textContent=elapsed(S.games[S.cur].at);
},20000);
applyPrefs();
render();
</script>
</body></html>
